<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="userscript-version" content="10">
<title>Steam Workshop Scraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root { --pico-font-size: 85%; }
body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { padding: .5rem 1rem; border-bottom: 1px solid var(--pico-muted-border-color); display: flex; justify-content: space-between; align-items: center; }
main { flex: 1; display: flex; gap: .5rem; padding: .5rem; overflow: hidden; }
#results-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .5rem; overflow-y: auto; align-content: start; flex: 1; min-height: 0; }
.grid-cell { cursor: pointer; padding: .5em; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; display: flex; flex-direction: column; gap: .25em; outline: none; position: relative; }
.grid-cell .grid-spinner { display: none; position: absolute; bottom: 4px; right: 4px; width: 12px; height: 12px; border: 2px solid var(--pico-muted-border-color); border-top-color: #44aa44; border-radius: 50%; animation: spin .6s linear infinite; }
.grid-cell.has-spinner .grid-spinner { display: block; }
.grid-cell:hover { border-color: var(--pico-primary-hover-background); }
.grid-cell:focus-visible { outline: 2px solid #44aa44; outline-offset: 2px; }
.grid-cell.selected { outline: 2px solid #44aa44; outline-offset: 2px; }
.grid-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 3px; background: var(--pico-muted-border-color); }
.grid-img-placeholder { width: 100%; aspect-ratio: 16/10; border-radius: 3px; background: var(--pico-muted-border-color); display: flex; align-items: center; justify-content: center; color: var(--pico-muted-color); font-size: .8rem; }
.grid-title { font-size: .82rem; font-weight: bold; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.grid-meta { font-size: .7rem; color: var(--pico-muted-color); display: flex; flex-wrap: wrap; gap: .2em .5em; }
.grid-scores { font-size: .7rem; font-weight: bold; display: flex; gap: .5em; }
.queued .grid-title::before { content: '\2605 '; color: #44aa44; }
#right-pane { flex: 0 0 360px; display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--pico-muted-border-color); padding-left: .5rem; }
#search-builder { flex-shrink: 0; margin-bottom: .5rem; }
.filter-row { display: flex; gap: .25rem; align-items: center; margin-bottom: .25rem; }
.filter-row select, .filter-row input { padding: 2px 4px; }
.filter-row select.field-select { flex: 2; }
.filter-row select.op-select { flex: 2; }
.filter-row input.value-input { flex: 3; }
.filter-row button { padding: 2px 6px; min-width: 2rem; }
#detail-pane { flex: 1; overflow-y: auto; min-height: 0; }
#detail-buttons { flex-shrink: 0; border-top: 1px solid var(--pico-muted-border-color); padding: .35rem 0 0 0; display: flex; gap: .25rem; }
.stat-row { margin-bottom: .25rem; }
.stat-label { color: var(--pico-muted-color); }
.stat-wilson { font-weight: bold; }
.wilson-p99 { color: #ffd700; }
.wilson-p99::before { content: '! '; }
.wilson-p99::after { content: ' !'; }
.wilson-p90 { color: #ffd700; }
.wilson-p50 { color: #e0e0e0; }
.wilson-low { color: #888; }
.size-small { color: var(--pico-muted-color); }
.size-medium { color: inherit; }
.size-large { color: #ffd700; }
.size-huge { color: #ff6347; }
#port-display { font-size: .8rem; color: var(--pico-muted-color); }
@media (max-width: 768px) {
  main { flex-direction: column; }
  #right-pane { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--pico-muted-border-color); padding-left: 0; padding-top: .5rem; }
  #results-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:1.2rem">Workshop Scraper</h1>
  <span style="display:flex;align-items:center;gap:.5rem">
    <button id="btn-daemon" style="padding:.2rem .6rem;font-size:.8rem;width:auto;margin:0">&#x2699; Daemon</button>
    <button id="btn-analysis" style="padding:.2rem .6rem;font-size:.8rem;width:auto;margin:0" title="View window analysis">&#x1F4C8; Analysis</button>
    <span id="port-display"></span>
  </span>
</header>
<main>
  <div id="results-pane">
    <div id="results-grid"></div>
  </div>
  <div id="right-pane">
    <div id="search-builder">
      <div id="filter-rows"></div>
      <div style="display:flex;gap:.25rem;margin-top:.25rem">
        <button id="btn-search" style="flex:2">Search</button>
        <button id="btn-save-filter" title="Save for scraper">&#x1F4BE;</button>
        <button id="btn-and" style="flex:1">AND</button>
        <button id="btn-or" style="flex:1">OR</button>
      </div>
      <div style="display:flex;gap:.25rem;margin-top:.25rem">
        <select id="sort-by" style="flex:2">
          <option value="title">Title</option>
          <option value="file_size">File Size</option>
          <option value="subscriptions">Subscriptions</option>
          <option value="favorited">Favorites</option>
          <option value="views">Views</option>
          <option value="workshop_id">Workshop ID</option>
          <option value="steam_created_at">Created Time</option>
          <option value="steam_updated_at">Updated Time</option>
          <option value="api_fetched_at">Fetched Time</option>
          <option value="wilson_subscription_score">Subscriber Score</option>
          <option value="wilson_favorite_score">Favorite Score</option>
        </select>
        <select id="sort-order" style="flex:1">
          <option value="ASC">ASC</option>
          <option value="DESC">DESC</option>
        </select>
        <button id="btn-stats" style="flex:0.5;width:auto;margin:0" title="Statistics">&#x1F4CA;</button>
      </div>
    </div>
    <div id="detail-pane">
      <p class="stat-label">Select an item to see details.</p>
    </div>
    <div id="detail-buttons">
      <button onclick="fetch('/api/fetch_new',{method:'POST'}).then(()=>alert('Fetch-new triggered!'))">Fetch New</button>
      <button onclick="doUpdateVisible()">Update Visible</button>
      <button id="btn-clear-pending" onclick="doClearPending()" title="Delete items that were never successfully scraped">Clear Pending</button>
    </div>
  </div>
</main>

<div id="daemon-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:700px;margin:0 auto">
    <h2>Daemon</h2>
    <p id="daemon-status" style="color:var(--pico-muted-color)">Loading...</p>
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
      <button id="daemon-start" style="width:auto">Start</button>
      <button id="daemon-stop" style="width:auto">Stop</button>
      <button id="daemon-restart" style="width:auto">Restart</button>
      <button id="daemon-close" class="secondary" style="width:auto">Close</button>
    </div>
    <pre id="daemon-log" style="height:50vh;overflow-y:auto;padding:.5rem;border:1px solid var(--pico-muted-border-color);border-radius:4px;font-size:.75rem;white-space:pre-wrap"></pre>
  </div>
</div>

<div id="sub-queue-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:600px;margin:0 auto">
    <h2>Auto-Subscribing...</h2>
    <p id="sub-progress" style="color:var(--pico-muted-color)"></p>
    <div id="sub-queue-list"></div>
    <button id="sub-clear-failed" style="margin-top:1rem;display:none">Clear Failed</button>
    <button id="sub-cancel" style="margin-top:1rem">Cancel</button>
  </div>
</div>

<div id="stats-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:900px;margin:0 auto">
    <h2>Statistics</h2>
    <button id="stats-close" class="secondary" style="width:auto;margin-bottom:.75rem">Close</button>
    <div id="stats-metrics"></div>
  </div>
</div>

<div id="analysis-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:900px;margin:0 auto">
    <h2>View Window Analysis</h2>
    <div class="analysis-controls">
      <label for="analysis-bucket-days">Bucket size (days)
        <input id="analysis-bucket-days" type="number" min="1" step="1" value="7">
      </label>
      <button id="analysis-recalc" style="width:auto;margin:0">Recalculate</button>
      <button id="analysis-close" class="secondary" style="width:auto;margin:0">Close</button>
    </div>
    <div id="analysis-summary"></div>
    <div id="analysis-table-host"></div>
  </div>
</div>

<style>
.sub-queue-item { display:flex;align-items:center;gap:.5em;padding:.5em;border-bottom:1px solid var(--pico-muted-border-color); }
.sub-queue-item .spinner { width:1em;height:1em;border:2px solid var(--pico-muted-border-color);border-top-color:#44aa44;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0; }
.sub-queue-item.done { opacity:.5; }
.sub-queue-item .countdown { font-size:.85em;color:var(--pico-muted-color);min-width:3em; }
.sub-queue-item.done .spinner { display:none; }
.sub-queue-item.done .countdown { display:none; }
.sub-queue-item.done::before { content:'\2713 '; color:#44aa44; flex-shrink:0; }
.sub-queue-item.failed .spinner { display:none; }
.sub-queue-item.failed .countdown { display:none; }
.sub-queue-item.failed::before { content:'\2717 '; color:#ff4444; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.translation-notice { color:var(--pico-muted-color);font-style:italic;font-size:.9em;margin:.4em 0; }
.stats-chunk { margin-bottom:1.25rem; }
.stats-chunk h3 { margin-bottom:.35rem; }
.stats-chunk-ms { color:var(--pico-muted-color);font-size:.75em;font-weight:normal; }
.stats-chunk-note { color:var(--pico-muted-color);font-size:.8em;margin-left:.4em;font-weight:normal; }
.stats-chunk-body { margin-top:.2rem; }
.stats-stuck { color:#ff6347;font-weight:bold;margin:.2rem 0; }
.stats-stuck ul { margin:.2rem 0 0 1rem; }
.stats-chunk-body ul { margin:.2rem 0 0 1rem; }
.stats-chunk-body progress { margin:0; }
.stats-table td, .stats-table th { padding:.15rem .5rem .15rem 0; }
.analysis-controls { display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.75rem;flex-wrap:wrap; }
.analysis-controls label { margin:0; }
.analysis-controls input { width:6rem;margin:0; }
/* The bar is the point of the table: it makes the median comparable at a
   glance across buckets whose absolute values differ by orders of magnitude. */
.analysis-table td, .analysis-table th { padding:.15rem .5rem .15rem 0;white-space:nowrap; }
.analysis-bar-track { background:var(--pico-muted-border-color);border-radius:3px;height:.9rem;min-width:120px; }
.analysis-bar { background:#44aa44;height:100%;border-radius:3px; }
</style>

<script>
const WEB_DELAY = {{ web_delay }};
const FILTER_SCHEMA = {{ filter_schema_json | safe }};

// Derived from schema
const ALL_FIELDS = FILTER_SCHEMA.map(f => f.field);
const FIELD_OPS = {};
FILTER_SCHEMA.forEach(f => {
  FIELD_OPS[f.field] = f.ops;
});
const ID_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'id').map(f => f.field);
const NUMERIC_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'number').map(f => f.field);
const TEXT_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'string').map(f => f.field);

let currentOffset = 0, hasMore = true, loading = false, cutoffs = {};
let _cutoffsCache = null, _cutoffsFilterKey = '';
let _subTitleText = 'No cutoff data', _favTitleText = 'No cutoff data';
let _listPollTimer = null;

// The header shows which port this panel answered on. location already knows
// it — it is the port in the address bar — so this reads the page's own origin
// rather than adding a request, and it stays right when the configured port
// changes between loads (there is no baked-in literal to go stale).
function showServerPort() {
  const el = document.getElementById('port-display');
  if (!el) return;
  el.textContent = location.port ? ':' + location.port : '';
}
showServerPort();

function updateOps(row) {
  const field = row.querySelector('.field-select').value;
  const opSelect = row.querySelector('.op-select');
  const cur = opSelect.value;
  const ops = FIELD_OPS[field] || ['contains','does_not_contain'];
  opSelect.innerHTML = ops.map(o => `<option value="${o}">${o.replace(/_/g,' ')}</option>`).join('');
  if (ops.includes(cur)) opSelect.value = cur;
}

function addRow(logic) {
  const container = document.getElementById('filter-rows');
  const div = document.createElement('div');
  div.className = 'filter-row';
  if (logic) div.dataset.logic = logic;
  div.innerHTML = `
    <select class="field-select" onchange="updateOps(this.parentElement)">${ALL_FIELDS.map(f => `<option value="${f}">${f}</option>`).join('')}</select>
    <select class="op-select"></select>
    <input class="value-input" type="text" placeholder="value">
    <button onclick="removeRow(this.parentElement)">&#x2715;</button>
  `;
  container.appendChild(div);
  updateOps(div);
}

function removeRow(row) { row.remove(); }

function getFilters() {
  const rows = document.querySelectorAll('#filter-rows .filter-row');
  const filters = [];
  rows.forEach(r => {
    const op = r.querySelector('.op-select').value;
    let val = r.querySelector('.value-input').value;
    if (op === 'percentile') {
      const n = parseInt(val, 10);
      if (isNaN(n)) val = '0';
      else val = String(Math.max(0, Math.min(99, n)));
      r.querySelector('.value-input').value = val;
    }
    const f = {field: r.querySelector('.field-select').value, op, value: val};
    if (r.dataset.logic) f.logic = r.dataset.logic;
    filters.push(f);
  });
  return filters;
}

async function loadCutoffs() {
  const filters = getFilters();
  const key = JSON.stringify(filters);
  if (key === _cutoffsFilterKey && _cutoffsCache !== null) return;
  const resp = await fetch('/api/cutoffs', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters})});
  cutoffs = await resp.json();
  if (cutoffs && typeof cutoffs === 'object' && Object.keys(cutoffs).length) {
    _cutoffsCache = cutoffs;
    _cutoffsFilterKey = key;
  } else {
    cutoffs = _cutoffsCache || {};
  }

  const sf = (k) => (cutoffs[k] != null) ? (cutoffs[k]*100).toFixed(1) + '%' : '?%';
  _subTitleText = 'p50=' + sf('wilson_subscription_p50') + ' p90=' + sf('wilson_subscription_p90') + ' p99=' + sf('wilson_subscription_p99') + ' [' + sf('wilson_subscription_min') + '..' + sf('wilson_subscription_max') + ']';
  _favTitleText  = 'p50=' + sf('wilson_favorite_p50') + ' p90=' + sf('wilson_favorite_p90') + ' p99=' + sf('wilson_favorite_p99') + ' [' + sf('wilson_favorite_min') + '..' + sf('wilson_favorite_max') + ']';
}

function wClass(score, key) {
  if (score == null) return 'wilson-low';
  const p99 = cutoffs[key + '_p99'] || 0;
  const p90 = cutoffs[key + '_p90'] || 0;
  const p50 = cutoffs[key + '_p50'] || 0;
  if (score >= p99) return 'wilson-p99';
  if (score >= p90) return 'wilson-p90';
  if (score >= p50) return 'wilson-p50';
  return 'wilson-low';
}

function fmtCount(n) {
  if (!n || n===0) return '0';
  n = Number(n);
  if (n < 1000) return String(n);
  if (n < 1000000) { const v=n/1000; return n<10000?v.toFixed(2)+'K':n<100000?v.toFixed(1)+'K':Math.round(v)+'K'; }
  const v=n/1000000; return n<10000000?v.toFixed(2)+'M':n<100000000?v.toFixed(1)+'M':Math.round(v)+'M';
}

function fmtSize(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 10) return mb.toFixed(2) + ' MB';
  if (mb < 100) return mb.toFixed(1) + ' MB';
  if (mb < 1000) return mb.toFixed(0) + ' MB';
  const gb = mb / 1024;
  if (gb < 10) return gb.toFixed(2) + ' GB';
  if (gb < 100) return gb.toFixed(1) + ' GB';
  return gb.toFixed(0) + ' GB';
}

function sizeClass(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  if (mb >= 10000) return 'size-huge';
  if (mb >= 1000) return 'size-large';
  if (mb >= 100) return 'size-medium';
  return 'size-small';
}

async function doSearch(reset = true) {
  if (loading) return;
  loading = true;
  // A reset search starts a new result set, so an item selected in the old one
  // is not a selection any more; keeping it would send restore hunting for a
  // row that is no longer there.
  if (reset) { _stopListPoll(); currentOffset = 0; hasMore = true; _selectedWid = null; document.getElementById('results-grid').innerHTML = ''; await loadCutoffs(); }

  const filters = getFilters();
  const resp = await fetch('/api/search', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({filters, sort_by: document.getElementById('sort-by').value, sort_order: document.getElementById('sort-order').value, offset: currentOffset, limit: 50})
  });
  const items = await resp.json();

  const grid = document.getElementById('results-grid');
  items.forEach((item, idx) => {
    const title = item.title_en || item.title || 'Untitled';
    const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
    const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;
    const size = fmtSize(item.file_size);

    let imgHtml;
    if (item.image_extension) {
      imgHtml = `<img class="grid-img" src="/images/${item.workshop_id}.${item.image_extension}" loading="lazy" alt="">`;
    } else {
      const label = (item.needs_image > 0) ? 'pending' : 'no image';
      imgHtml = `<div class="grid-img-placeholder">${label}</div>`;
    }

    const div = document.createElement('div');
    div.className = 'grid-cell';
    div.setAttribute('data-wid', item.workshop_id);
    div.setAttribute('tabindex', '0');
    if (idx === 0) div.setAttribute('data-batch-first', '1');
    if (item.is_queued_for_subscription) div.classList.add('queued');
    div.innerHTML = `${imgHtml}
      <div class="grid-title">${title}</div>
      <div class="grid-meta"><span class="${sizeClass(item.file_size)}">${size}</span></div>
      <div class="grid-scores">
        <span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}">S ${wss!=null?wss+'%':'—'}</span>
        <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}">F ${wfs!=null?wfs+'%':'—'}</span>
      </div>
      <div class="grid-spinner"></div>`;
    if (_itemHasPending(item)) div.classList.add('has-spinner');
    div.onclick = () => showDetail(item.workshop_id);
    grid.appendChild(div);
  });

  currentOffset += items.length;
  hasMore = items.length >= 50;
  loading = false;

  if (_listNeedsPoll(items)) {
    _startListPoll(filters, document.getElementById('sort-by').value, document.getElementById('sort-order').value);
  }
  _placeSentinel();
  // A reset re-establishes the committed filter/sort view; save it once the
  // result set it describes is on screen.
  if (reset) _saveViewState();
}

function _placeSentinel() {
  if (loading || !hasMore) return;
  let sentinel = document.getElementById('scroll-sentinel');
  if (!sentinel) {
    sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
  } else {
    sentinel.remove();
  }

  const first = document.querySelector('.grid-cell[data-batch-first]');
  if (!first) return;
  first.removeAttribute('data-batch-first');

  const rect = first.getBoundingClientRect();
  if (rect.top < window.innerHeight) {
    setTimeout(() => doSearch(false), 0);
    return;
  }

  first.parentNode.insertBefore(sentinel, first);
  _scrollObserver.observe(sentinel);
}

function _itemHasPending(item) {
  return (item.needs_image >= 5 && !item.image_extension)
      || item.translation_priority >= 5
      || item.needs_web_scrape >= 5
      || item.api_priority >= 5;
}

function _listNeedsPoll(items) {
  for (const item of items) {
    if (_itemHasPending(item)) return true;
  }
  return false;
}

function _startListPoll(filters, sortBy, sortOrder) {
  _stopListPoll();

  async function tick() {
    if (!_listPollTimer) return;  // stopped during fetch
    try {
      const grid = document.getElementById('results-grid');
      const pending = [];
      grid.querySelectorAll('.grid-cell.has-spinner[data-wid]').forEach(el => {
        const wid = parseInt(el.getAttribute('data-wid'), 10);
        pending.push(wid);
      });
      if (!pending.length) { _stopListPoll(); return; }

      const resp = await fetch('/api/items', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: pending})
      });
      const items = await resp.json();
      if (!Array.isArray(items)) return;

      items.forEach(item => {
        const el = grid.querySelector(`.grid-cell[data-wid="${item.workshop_id}"]`);
        if (!el) return;
        const title = item.title_en || item.title || 'Untitled';
        const titleEl = el.querySelector('.grid-title');
        if (titleEl) titleEl.textContent = title;
        if (item.image_extension && !el.querySelector('.grid-img')) {
          const ph = el.querySelector('.grid-img-placeholder');
          if (ph) {
            ph.outerHTML = `<img class="grid-img" src="/images/${item.workshop_id}.${item.image_extension}" loading="lazy" alt="">`;
          }
        }
        if (_itemHasPending(item)) {
          el.classList.add('has-spinner');
        } else {
          el.classList.remove('has-spinner');
        }
        const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
        const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;
        const scores = el.querySelector('.grid-scores');
        if (scores) scores.innerHTML = `
          <span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}">S ${wss!=null?wss+'%':'—'}</span>
          <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}">F ${wfs!=null?wfs+'%':'—'}</span>`;
      });

      const delay = Math.max(1, Math.log2(pending.length)) * 1000;
      _listPollTimer = setTimeout(tick, delay);
    } catch(e) { console.debug('List poll error', e); /* keep trying */ }
  }

  _listPollTimer = setTimeout(tick, 0);
}

function _stopListPoll() {
  if (_listPollTimer) {
    clearTimeout(_listPollTimer);
    _listPollTimer = null;
    document.querySelectorAll('.grid-img-placeholder').forEach(ph => {
      if (ph.textContent.startsWith('pending')) ph.textContent = 'no image';
    });
  }
}

let _showTranslated = true;   // mirrors DetailsPane.show_translated in the TUI
let _currentDetail = null;    // cached so the toggle re-renders without a refetch

function toggleTranslation() {
  _showTranslated = !_showTranslated;
  if (_currentDetail) renderDetail(_currentDetail);
}

function renderDetail(item) {
  _currentDetail = item;
  const pane = document.getElementById('detail-pane');
  // Only an item that actually has a stored translation can be shown either
  // way; otherwise the original is the only text there is.
  const translated = _showTranslated && !!item.has_translation;
  const title = translated
    ? (item.display_title || 'N/A')
    : (item.display_title_original || 'N/A');
  const creator = translated
    ? (item.personaname_en || item.personaname || item.creator || 'N/A')
    : (item.personaname || item.creator || 'N/A');
  const url = `https://steamcommunity.com/sharedfiles/filedetails/?id=${item.workshop_id}`;

  const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
  const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;

  const subs = item.subscriptions||0, lsubs = item.lifetime_subscriptions||0;
  const favs = item.favorited||0, lfavs = item.lifetime_favorited||0;
  const created = item.steam_created_at ? new Date(item.steam_created_at*1000).toISOString().slice(0,10) : 'N/A';
  const updated = item.steam_updated_at && item.steam_updated_at !== item.steam_created_at ? new Date(item.steam_updated_at*1000).toISOString().slice(0,10) : null;
  const tags = (()=>{
    const raw = item.tags || '';
    if (!raw) return 'None';
    if (raw.startsWith('[')) {
      try { const t = JSON.parse(raw); return Array.isArray(t) ? t.join(', ') : 'None'; }
      catch(e) { console.debug('Tag JSON parse failed', e); return 'None'; }
    }
    return raw;
  })();
  const size = fmtSize(item.file_size);
  const sc = sizeClass(item.file_size);

  const fmtTs = (ts) => ts ? new Date(ts*1000).toISOString().slice(0,19).replace('T',' ') : 'N/A';
  const tooltip = [
    `Filename: ${item.filename || 'N/A'}`,
    `App Name: ${item.app_name || 'N/A'}`,
    `Creator AppID: ${item.creator_appid || 'N/A'}`,
    `Consumer AppID: ${item.consumer_appid || 'N/A'}`,
    `File Type: ${item.file_type ?? 'N/A'}`,
    `Language: ${item.language ?? 'N/A'}`,
    `Visibility: ${item.visibility ?? 'N/A'}`,
    `Banned: ${item.banned ? 'Yes' + (item.ban_reason ? ' — ' + item.ban_reason : '') : 'No'}`,
    `Status: ${item.status ?? 'N/A'}`,
    `Translation Priority: ${item.translation_priority || 0}`,
    `Needs Web Scrape: ${item.needs_web_scrape || 0}`,
    `Needs Image: ${item.needs_image || 0}`,
    `first_seen_at: ${fmtTs(item.first_seen_at)}`,
    `api_fetched_at: ${fmtTs(item.api_fetched_at)}`,
    `scrape_version: ${fmtTs(item.scrape_version)}`,
    `translate_version: ${fmtTs(item.translate_version)}`,
    `hcontent_file: ${item.hcontent_file || 'N/A'}`,
    `hcontent_preview: ${item.hcontent_preview || 'N/A'}`,
  ].join('&#10;');

  // The original view falls back to the untranslated short description, so a
  // missing extended description never leaks translated text into it.
  let desc, fallback;
  if (translated) {
    desc = item.description_html || '';
    fallback = item.short_description_en || item.short_description;
  } else {
    desc = item.description_html_original || '';
    fallback = item.short_description;
  }
  if (!desc && fallback) desc = '<p>' + fallback + '</p>';

  const toggle = item.has_translation
    ? `<button onclick="toggleTranslation();return false;">${_showTranslated ? 'Show Original' : 'Show Translation'}</button>`
    : '';
  // Matches the TUI, which notes a pending translation only while there is no
  // stored one yet.
  const notice = ((item.translation_priority || 0) > 0 && !item.translate_version)
    ? '<p class="translation-notice">Translation requested, currently in queue&hellip;</p>'
    : '';

  pane.innerHTML = `
    <h2><a href="${url}" target="_blank" title="${tooltip}">${title}</a></h2>
    <p>by <b>${creator}</b> &mdash; <small>Workshop ID: ${item.workshop_id}</small></p>
    <p class="stat-wilson"><span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}" title="${_subTitleText}">Subscriber Score: ${wss!=null?wss+'%':'N/A'}</span> &nbsp; <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}" title="${_favTitleText}">Favorite Score: ${wfs!=null?wfs+'%':'N/A'}</span></p>
    <div class="stat-row"><span class="stat-label">Created:</span> ${created}</div>
    <div class="stat-row"><span class="stat-label">Size:</span> <span class="${sc}">${size || 'N/A'}</span></div>
    ${updated ? `<div class="stat-row"><span class="stat-label">Updated:</span> ${updated}</div>` : ''}
    <div class="stat-row"><span class="stat-label">Views:</span> ${fmtCount(item.views || 0)}</div>
    <div class="stat-row"><span class="stat-label">Subs:</span> ${fmtCount(subs)} / ${fmtCount(lsubs)}</div>
    <div class="stat-row"><span class="stat-label">Favs:</span> ${fmtCount(favs)} / ${fmtCount(lfavs)}</div>
    <div class="stat-row"><span class="stat-label">Tags:</span> <small>${tags}</small></div>
    <p><button onclick="doSubscribe(${item.workshop_id}, ${item.consumer_appid || 0});return false;">Subscribe</button> ${toggle}</p>
    ${notice}
    ${desc ? '<div style="border-left:3px solid var(--pico-muted-border-color);padding-left:.5rem;margin-top:.5rem">'+desc+'</div>' : ''}
  `;
}

let _detailPollWid = null, _detailPollTimer = null;

function _detailNeedsPoll(item) {
  return (item.translation_priority || 0) > 0;
}

function _startDetailPoll(wid, item) {
  _stopDetailPoll();
  if (!_detailNeedsPoll(item)) return;
  _detailPollWid = wid;
  _detailPollTimer = setInterval(async () => {
    try {
      // Read-only: this polls every 3s, so it must never re-arm the fetch queue.
      const resp = await fetch('/api/item/' + wid);
      if (!resp.ok || wid !== _detailPollWid) { _stopDetailPoll(); return; }
      const updated = await resp.json();
      if (updated.error) { _stopDetailPoll(); return; }
      if (!_detailNeedsPoll(updated)) {
        renderDetail(updated);
        _stopDetailPoll();
      }
    } catch(e) { console.debug('Detail poll error', e); /* keep trying */ }
  }, 3000);
}

function _stopDetailPoll() {
  if (_detailPollTimer) { clearInterval(_detailPollTimer); _detailPollTimer = null; }
  _detailPollWid = null;
}

async function showDetail(wid) {
  _stopDetailPoll();
  const pane = document.getElementById('detail-pane');
  pane.innerHTML = '<p>Loading...</p>';
  try {
    // Opening a pane is the one path that applies detail priority. The 3-second
    // poll below uses the read-only route, so it cannot re-queue the item.
    const resp = await fetch('/api/item/' + wid + '/open', {method: 'POST'});
    if (!resp.ok) {
      pane.innerHTML = `<p>Error loading item ${wid}: ${resp.status} ${resp.statusText}</p>`;
      return;
    }
    const item = await resp.json();
    if (item.error) { pane.innerHTML = '<p>Item not found.</p>'; return; }

  renderDetail(item);
  document.querySelectorAll('#results-grid .grid-cell').forEach(el => el.classList.remove('selected'));
  const cell = document.querySelector(`#results-grid .grid-cell[data-wid="${wid}"]`);
  if (cell) { cell.classList.add('selected'); cell.focus(); }
  _selectedWid = wid;
  _startDetailPoll(wid, item);
  _saveViewState();
  } catch(e) { pane.innerHTML = '<p>Error loading detail: ' + e.message + '</p>'; }
}

  // Destructive and irreversible, so the prompt names the rows the server will
  // delete -- the same predicate as the TUI's action: no status (or 404) and no

  const ok = confirm(
    'Delete every item that was never successfully scraped?\n\n' +
    'This removes all pending rows from the database: items with no status or a ' +
    '404 status that have never been fetched from the API. It cannot be undone.'

  try {
    resp = await fetch('/api/clear_pending', {method: 'POST'});

function _userscriptPresent() {
  const body = document.body;
  if (!body || !body.dataset.userscript) return false;
  const ver = parseInt(body.dataset.userscriptVer || '0', 10);

      `Your Subscribe Bridge userscript is outdated (v${ver}). The page expects v${US_EXPECTED_VER}.\n\n` +
      'Click OK to open the latest version for installation.'

async function doSubscribe(wid, appid) {

// ── View state persistence ────────────────────────────────────────────────
// The browser's own view -- filter rows, sort, the open item, the scroll
// position -- is per-browser layout, not scraper configuration. `.tui_state.yaml`
// has a different shape and is rewritten by the TUI on its own schedule, so
// sharing the file would have each front end overwrite fields the other does
// not understand. Browser storage is the natural home. The stored entry is
// versioned and shape-checked exactly like the statistics panel's ordering
// entry, so a stale build's record is ignored rather than trusted.
const VIEW_STATE_KEY = 'view.state.v1';
const VIEW_STATE_VERSION = 1;
// Restoration pages through the result set to reach a saved scroll position,
// but only this far: an item thousands of rows down is not worth a page load's
// worth of requests just to re-open its pane.
const MAX_RESTORE_BATCHES = 40;

let _selectedWid = null;    // workshop_id whose detail pane is open
let _viewSaveTimer = null;  // throttles the scroll listener's writes
let _restoringView = false; // suppresses saves while loadState restores

function _loadViewState() {
  try {
    const raw = localStorage.getItem(VIEW_STATE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== VIEW_STATE_VERSION || !Array.isArray(parsed.filters)) return null;
    const filters = [];
    parsed.filters.forEach(function(f) {
      if (!f || typeof f.field !== 'string' || typeof f.op !== 'string') return;
      // A field the schema no longer has would render as a blank dropdown;
      // drop it rather than show a filter that cannot be edited.
      if (ALL_FIELDS.indexOf(f.field) === -1) return;
      const entry = {field: f.field, op: f.op, value: f.value == null ? '' : String(f.value)};
      if (typeof f.logic === 'string') entry.logic = f.logic;
      filters.push(entry);
    });
    return {
      filters: filters,
      sort_by: typeof parsed.sort_by === 'string' ? parsed.sort_by : '',
      sort_order: typeof parsed.sort_order === 'string' ? parsed.sort_order : '',
      selected: (typeof parsed.selected === 'number' && isFinite(parsed.selected)) ? parsed.selected : null,
      scroll: (typeof parsed.scroll === 'number' && isFinite(parsed.scroll) && parsed.scroll > 0) ? parsed.scroll : 0,
    };
  } catch (e) {
    // A corrupt entry is not worth failing the page over.
    console.debug('view state load failed', e);
    return null;
  }
}

function _saveViewState() {
  if (_restoringView) return;
  try {
    const grid = document.getElementById('results-grid');
    localStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      v: VIEW_STATE_VERSION,
      filters: getFilters(),
      sort_by: document.getElementById('sort-by').value,
      sort_order: document.getElementById('sort-order').value,
      selected: _selectedWid,
      scroll: grid ? grid.scrollTop : 0,
    }));
  } catch (e) {
    console.debug('view state save failed', e);
  }
}

function _applyFilters(filters) {
  const container = document.getElementById('filter-rows');
  container.innerHTML = '';
  filters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'filter-row';
    if (i > 0 && f.logic) div.dataset.logic = f.logic;
    div.innerHTML = `
      <select class="field-select" onchange="updateOps(this.parentElement)">${ALL_FIELDS.map(fn => `<option value="${fn}" ${fn===f.field?'selected':''}>${fn}</option>`).join('')}</select>
      <select class="op-select"></select>
      <input class="value-input" type="text" value="${f.value||''}" placeholder="value">
      <button onclick="removeRow(this.parentElement)">&#x2715;</button>
    `;
    container.appendChild(div);
    updateOps(div);
    if (f.op) div.querySelector('.op-select').value = f.op;
  });
}

// Ask doSearch for the next page until `done` holds, exactly as scrolling to
// the bottom would. doSearch owns currentOffset and the sentinel, so this never
// touches either; a page that moves no offset means there is nothing left.
async function _loadUntil(done, maxBatches) {
  let batches = 0;
  while (hasMore && !done() && batches < maxBatches) {
    const before = currentOffset;
    await doSearch(false);
    if (currentOffset === before) break;
    batches += 1;
  }
}

async function _restoreView(state) {
  const grid = document.getElementById('results-grid');
  await _loadUntil(function() {
    return state.scroll <= 0 || grid.scrollHeight >= state.scroll + grid.clientHeight;
  }, MAX_RESTORE_BATCHES);
  if (state.selected != null) {
    await _loadUntil(function() {
      return !!grid.querySelector('.grid-cell[data-wid="' + state.selected + '"]');
    }, MAX_RESTORE_BATCHES);
    if (grid.querySelector('.grid-cell[data-wid="' + state.selected + '"]')) {
      await showDetail(state.selected);
    }
  }
  // Scroll last: showDetail focuses the cell, and focus can move the grid, so
  // the saved position has to be the final word.
  if (state.scroll > 0) grid.scrollTop = state.scroll;
}

async function loadState() {
  // Precedence is deliberately simple: a browser that has been to this page
  // before has its own saved view and that wins. Only a first visit (or one
  // with cleared storage) falls back to the TUI's saved filters.
  const local = _loadViewState();
  try {
    if (local) {
      _applyFilters(local.filters);
      if (local.sort_by) document.getElementById('sort-by').value = local.sort_by;
      if (local.sort_order) document.getElementById('sort-order').value = local.sort_order;
    } else {
      const resp = await fetch('/api/state');
      const state = await resp.json();
      if (state.filters && state.filters.length) _applyFilters(state.filters);
      if (state.sort_by) document.getElementById('sort-by').value = state.sort_by;
      if (state.sort_order) document.getElementById('sort-order').value = state.sort_order;
    }
  } catch(e) { console.warn('loadState fetch failed', e); }
  if (!document.getElementById('filter-rows').children.length) addRow();
  _restoringView = true;
  try {
    await doSearch(true);
    if (local) await _restoreView(local);
  } finally {
    _restoringView = false;
  }
}

// Scroll fires per frame; the value is only read on the next load, so a short
// settle delay is enough and keeps the write off the scroll path.
document.getElementById('results-grid').addEventListener('scroll', function() {
  if (_viewSaveTimer) return;
  _viewSaveTimer = setTimeout(function() {
    _viewSaveTimer = null;
    _saveViewState();
  }, 250);
}, {passive: true});
window.addEventListener('pagehide', _saveViewState);

document.getElementById('sort-by').onchange = () => doSearch(true);
document.getElementById('sort-order').onchange = () => doSearch(true);
document.getElementById('btn-search').onclick = () => doSearch(true);
document.getElementById('btn-and').onclick = () => addRow('AND');
document.getElementById('btn-or').onclick = () => addRow('OR');
// /api/save_filter can reject the save: it answers 400 with a message when no
// target AppID is configured. Alerting "saved" regardless, as this did, told
// the user their filters were stored when they were not — the server's own
// message is the only thing that says why, so surface it instead of swallowing
// it, and only claim success on a 2xx.
async function saveFilterAndReport() {
  let resp;
  try {
    resp = await fetch('/api/save_filter', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({filters: getFilters()})
    });
  } catch (e) {
    alert('Filter not saved: ' + e.message);
    return;
  }
  if (!resp.ok) {
    let detail = resp.status + ' ' + resp.statusText;
    try {
      const body = await resp.json();
      if (body && body.error) detail = body.error;
    } catch (e) { /* a non-JSON body leaves the status line as the reason */ }
    alert('Filter not saved: ' + detail);
    return;
  }
  alert('Filter saved for scraper.');
}
document.getElementById('btn-save-filter').onclick = saveFilterAndReport;

const _scrollObserver = new IntersectionObserver((entries) => {
  if (loading || !hasMore || !currentOffset) return;
  if (entries[0].isIntersecting) doSearch(false);
});

document.addEventListener('blur', e => {
  try {
    if (!e.target || typeof e.target.classList === 'undefined') return;
    if (!e.target.classList.contains('value-input')) return;
    const row = e.target.parentElement;
    if (!row) return;
    const opSelect = row.querySelector('.op-select');
    if (!opSelect || opSelect.value !== 'percentile') return;
    let v = parseInt(e.target.value, 10);
    if (isNaN(v)) { e.target.value = '0'; return; }
    v = Math.max(0, Math.min(99, v));
    e.target.value = String(v);
  } catch (err) { console.debug('Blur handler error', err); /* must never break the page */ }
}, true);

document.addEventListener('keydown', e => {
  const grid = document.getElementById('results-grid');
  if (!grid.contains(document.activeElement)) return;
  if (!document.activeElement.classList.contains('grid-cell')) return;

  const wid = parseInt(document.activeElement.getAttribute('data-wid'), 10);
  const cells = [...grid.querySelectorAll('.grid-cell')];
  const idx = cells.indexOf(document.activeElement);

  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    fetch('/api/toggle_sub/' + wid, {method:'POST'}).then(() => {
      document.activeElement.classList.toggle('queued');
    });
    return;
  }

  if (e.key === 'l' || e.key === 'L') {
    e.preventDefault();
    _startAutoSubscribe();
    return;
  }

  let nextIdx = idx;
  if (e.key === 'ArrowRight') nextIdx = idx + 1;
  else if (e.key === 'ArrowLeft') nextIdx = idx - 1;
  else if (e.key === 'ArrowDown') {
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    nextIdx = Math.min(idx + cols, cells.length - 1);
  }
  else if (e.key === 'ArrowUp') {
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    nextIdx = Math.max(idx - cols, 0);
  }
  else return;

  e.preventDefault();
  if (nextIdx >= 0 && nextIdx < cells.length) {
    const cell = cells[nextIdx];
    cell.focus();
    cell.scrollIntoView({block:'nearest'});
    showDetail(parseInt(cell.getAttribute('data-wid'), 10));
  }
});

let _subPollIv = null;
let _subScheduleIv = null;
let _subCanceled = false;
let _subThrottleStopped = false;

async function _startAutoSubscribe() {
  const resp = await fetch('/api/queued');
  const items = await resp.json();
  if (!items.length) { alert('No items queued for subscription.'); return; }

  const overlay = document.getElementById('sub-queue-overlay');
  const list = document.getElementById('sub-queue-list');
  const progress = document.getElementById('sub-progress');
  overlay.style.display = 'block';
  progress.textContent = `0 / ${items.length}`;
  list.innerHTML = items.map(it => `
    <div class="sub-queue-item" data-wid="${it.workshop_id}">
      <span class="spinner"></span>
      <span class="countdown"></span>
      <span>${it.title_en || it.title || 'Untitled'}</span>
    </div>
  `).join('');

  // Ensure clear-failed button is hidden on fresh start
  const clearBtn = document.getElementById('sub-clear-failed');
  if (clearBtn) clearBtn.style.display = 'none';
  document.getElementById('sub-cancel').textContent = 'Cancel';

  await fetch('/api/pause', {method:'POST'});

  _subCanceled = false;
  const stepDelay = WEB_DELAY * 1000;
  const startTime = Date.now();
  const verified = new Set();
  const opened = new Set();
  const callbackOrigin = encodeURIComponent(location.origin);

  // Poll for verification — marks items done/failed when userscript reports back
  _subPollIv = setInterval(async () => {
    try {
      const [qresp, fresp] = await Promise.all([
        fetch('/api/queued'),
        fetch('/api/sub_failures')
      ]);
      const queued = await qresp.json();
      const failures = await fresp.json();
      const queuedIds = new Set(queued.map(q => q.workshop_id));
      const failedIds = new Set(failures);
      let changed = false;
      items.forEach(item => {
        if (!queuedIds.has(item.workshop_id) && !verified.has(item.workshop_id)) {
          verified.add(item.workshop_id);
          const row = list.querySelector(`[data-wid="${item.workshop_id}"]`);
          if (row) row.classList.add(failedIds.has(item.workshop_id) ? 'failed' : 'done');
          changed = true;
        }
      });

      progress.textContent = verified.size + ' / ' + items.length;

      const scheduleDone = opened.size >= items.length;
      const allDone = verified.size >= items.length;

      if (allDone) {
        clearInterval(_subPollIv);
        _subPollIv = null;
        await fetch('/api/resume', {method:'POST'});
        setTimeout(() => { overlay.style.display = 'none'; }, 2000);
        return;
      }

      // Show "Clear Failed" if schedule finished + grace period passed + stuck items remain
      if (scheduleDone && !_subCanceled) {
        var grace = Date.now() - startTime > (items.length * stepDelay) + 15000;
        var stuck = items.length - verified.size;
        if (grace && stuck > 0) {
          var cb = document.getElementById('sub-clear-failed');
          if (cb) {
            cb.textContent = 'Clear Failed (' + stuck + ')';
            cb.style.display = '';
          }
        }
      }
    } catch(e) { console.debug('Autosubscribe poll error', e); /* continue */ }
  }, 1000);

  // Stop launching tabs while Steam is refusing us. Checked once per tab opened,
  // so it costs one request per attempt rather than a poll.
  async function _checkSubThrottle() {
    try {
      const resp = await fetch('/api/sub_health');
      const health = await resp.json();
      if (!health.throttled_at) return;
      const since = (Date.now() / 1000) - health.throttled_at;
      if (since >= health.retry_after) return;
      // A subscribe pass pauses the daemon for its duration, and the daemon is
      // only released when the pass ends -- either every item was verified, or
      // the user cancelled. Stopping the tabs early ends the pass too, so the
      // release has to happen here or the daemon stays paused indefinitely.
      _subThrottleStopped = true;
      if (_subScheduleIv) { clearInterval(_subScheduleIv); _subScheduleIv = null; }
      if (_subPollIv) { clearInterval(_subPollIv); _subPollIv = null; }
      await fetch('/api/resume', {method:'POST'});
      const cancelBtn = document.getElementById('sub-cancel');
      if (cancelBtn) cancelBtn.textContent = 'Close';
      const p = document.getElementById('sub-progress');
      if (p) {
        p.textContent = 'Steam is throttling subscription requests. Stopped opening tabs, and ' +
          'released the daemon. The rest stay queued and can be retried in about ' +
          Math.ceil((health.retry_after - since) / 60) + ' minute(s).';
      }
    } catch (e) { console.debug('sub_health check failed', e); /* keep the drain running */ }
  }

  // Countdown + tab-open loop
  _subScheduleIv = setInterval(() => {
    if (_subCanceled) return;  // stop launching new tabs on cancel
    const elapsed = Math.floor((Date.now() - startTime) / 1000);

    items.forEach((item, i) => {
      const row = list.querySelector(`[data-wid="${item.workshop_id}"]`);
      if (!row) return;
      const countdown = row.querySelector('.countdown');
      if (!countdown) return;

      const openAt = i * Math.ceil(stepDelay / 1000);
      if (opened.has(item.workshop_id)) {
        countdown.textContent = '';
        return;
      }

      if (elapsed >= openAt) {
        opened.add(item.workshop_id);
        const w = window.open(
          'https://steamcommunity.com/sharedfiles/filedetails/?id=' + item.workshop_id + '&autosubscribe=true&callback_origin=' + callbackOrigin,
          'subtab_' + item.workshop_id
        );
        if (w) { w.blur(); window.focus(); }
        countdown.textContent = '';
        _checkSubThrottle();
      } else {
        countdown.textContent = (openAt - elapsed) + 's';
      }
    });

    if (opened.size >= items.length) {
      clearInterval(_subScheduleIv);
      _subScheduleIv = null;
    }
  }, 250);
}

document.getElementById('sub-cancel').onclick = () => {
  if (_subScheduleIv) {
    _subCanceled = true;
    clearInterval(_subScheduleIv);
    _subScheduleIv = null;
    document.getElementById('sub-cancel').textContent = 'Close';
  } else {
    // Second click (Close): dismiss overlay
    if (_subPollIv) { clearInterval(_subPollIv); _subPollIv = null; }
    // Dequeue any remaining unverified items so they don't stick -- unless the
    // pass was stopped by throttling, where the whole point is to leave them
    // queued so the next drain retries them.
    if (!_subThrottleStopped) {
      var rows = document.querySelectorAll('.sub-queue-item:not(.done)');
      rows.forEach(function(row) {
        var wid = row.getAttribute('data-wid');
        if (wid) fetch('/api/subscribed/' + wid, {method:'POST'});
        row.classList.add('done');
      });
    }
    fetch('/api/resume', {method:'POST'});
    document.getElementById('sub-queue-overlay').style.display = 'none';
  }
};

document.getElementById('sub-clear-failed').onclick = () => {
  var rows = document.querySelectorAll('.sub-queue-item:not(.done)');
  rows.forEach(function(row) {
    var wid = row.getAttribute('data-wid');
    if (wid) fetch('/api/subscribed/' + wid, {method:'POST'});
    row.classList.add('done');
  });
};

// ── Daemon control ────────────────────────────────────────────────────────
let _daemonPollIv = null;
let _daemonLogOffset = 0;

async function _refreshDaemonStatus() {
  try {
    const resp = await fetch('/api/daemon');
    const st = await resp.json();
    const el = document.getElementById('daemon-status');
    if (!el) return;
    const log = st.log_file ? ' — log: ' + st.log_file : '';
    el.textContent = (st.running ? 'Running (PID: ' + st.pid + ')' : 'Not running') + log;
  } catch(e) { console.debug('Daemon status poll error', e); /* keep polling */ }
}

async function _pollDaemonLog() {
  const pre = document.getElementById('daemon-log');
  if (!pre) return;
  try {
    const resp = await fetch('/api/daemon/log?since=' + _daemonLogOffset);
    const data = await resp.json();
    if (data.reset) {
      // The server jumped to the tail — first poll of a large log, rotation or
      // truncation, or this poll falling further behind than it will send — so
      // nothing on screen continues the new lines. Drop them and resume from the
      // server's offset below.
      pre.textContent = '';
    }
    if (data.lines && data.lines.length) {
      pre.textContent += data.lines.join('\n') + '\n';
      const kept = pre.textContent.split('\n');
      if (kept.length > 500) pre.textContent = kept.slice(-500).join('\n');
      pre.scrollTop = pre.scrollHeight;
    }
    if (typeof data.offset === 'number') _daemonLogOffset = data.offset;
  } catch(e) { console.debug('Daemon log poll error', e); /* keep polling */ }
}

function _openDaemonPanel() {
  document.getElementById('daemon-overlay').style.display = 'block';
  _daemonLogOffset = 0;
  const pre = document.getElementById('daemon-log');
  if (pre) pre.textContent = '';
  _refreshDaemonStatus();
  _pollDaemonLog();
  if (!_daemonPollIv) {
    _daemonPollIv = setInterval(() => { _refreshDaemonStatus(); _pollDaemonLog(); }, 2000);
  }
}

function _closeDaemonPanel() {
  // Release the poll timer when the panel closes; it is the only thing keeping
  // the daemon routes hot while the panel is hidden.
  if (_daemonPollIv) { clearInterval(_daemonPollIv); _daemonPollIv = null; }
  document.getElementById('daemon-overlay').style.display = 'none';
}

document.getElementById('btn-daemon').onclick = _openDaemonPanel;
document.getElementById('daemon-close').onclick = _closeDaemonPanel;
document.getElementById('daemon-start').onclick = async () => {
  await fetch('/api/daemon/start', {method:'POST'});
  _refreshDaemonStatus();
};
document.getElementById('daemon-stop').onclick = async () => {
  await fetch('/api/daemon/stop', {method:'POST'});
  _refreshDaemonStatus();
};
document.getElementById('daemon-restart').onclick = async () => {
  await fetch('/api/daemon/restart', {method:'POST'});
  _refreshDaemonStatus();
};

// ── Statistics panel ──────────────────────────────────────────────────────
// Every metric is an independent chunk: the panel asks the server for the
// catalogue, then requests each metric separately and fills its own section the
// moment that response lands. Nothing is grouped or classified by cost, and no
// request waits on another. The *request order* is the seed order on the first
// ever open; after that it follows the durations measured on the previous open,
// persisted in localStorage, so the order tracks the data rather than the seed
// table. Refresh is per metric too: each chunk re-requests itself after a delay
// derived from its own last duration, so a slow metric cannot hold up a fast one.
const STATS_LABELS = {
  totals: 'Totals',
  high_water: 'Last successful API fetch',
  app_tracking: 'App tracking',
  status_counts: 'Status counts',
  coverage: 'Coverage',
  stuck_work: 'Stuck work',
  fetch_recency: 'Fetch recency',
  translation_status: 'Translation status',
  priority_breakdowns: 'Queue priorities',
  tag_counts: 'Tags',
};

// The stored order is deliberately tiny and versioned, so a stale or corrupt
// entry from an older build can never break the panel: it is simply ignored.
const STATS_ORDER_KEY = 'stats.metric-order.v1';
const STATS_ORDER_VERSION = 1;
const STATS_REFRESH_FACTOR = 50;    // 50 x the metric's own measured duration
const STATS_MIN_REFRESH_MS = 2000;  // ...but never more often than every 2 s

let _statsCatalogue = [];   // [{name, note, seed_ms}] as served
let _statsTimers = {};      // metric -> setTimeout id, one per chunk
let _statsMeasured = {};    // metric -> ms, loaded from storage, updated live
let _statsToken = 0;

function _statLabel(name) {
  return STATS_LABELS[name] || name.replace(/_/g, ' ');
}

function _fmtTimestamp(ts) {
  return ts ? new Date(ts * 1000).toISOString().slice(0, 16).replace('T', ' ') : 'never';
}

function _renderCoverage(cov) {
  const total = cov.total || 0;
  if (!total) return '<p class="stat-label">No live items to cover.</p>';
  const stages = [
    ['api_fetched', 'API data'],
    ['described', 'Description'],
    ['imaged', 'Image'],
    ['translated', 'Translation'],
    ['attributed', 'Creator'],
  ];
  const rows = stages.map(function(stage) {
    const done = cov[stage[0]] || 0;
    const pct = done / total * 100;
    return '<tr><td>' + stage[1] + '</td>'
      + '<td style="white-space:nowrap">' + fmtCount(done) + ' / ' + fmtCount(total) + '</td>'
      + '<td style="width:45%"><progress value="' + pct.toFixed(1) + '" max="100"></progress></td>'
      + '<td>' + pct.toFixed(1) + '%</td></tr>';
  }).join('');
  return '<p class="stat-label">Progress over ' + fmtCount(total) + ' live items (dead items excluded).</p>'
    + '<table class="stats-table"><tbody>' + rows + '</tbody></table>';
}

function _renderStuck(stuck) {
  const queues = [['web', 'Web scrape'], ['image', 'Image'], ['translation', 'Translation'], ['api', 'API fetch']];
  let total = 0;
  queues.forEach(function(q) { total += stuck[q[0]] || 0; });
  if (!total) return '<p style="color:#44aa44">No dead items are still sitting in a queue.</p>';
  const items = queues.map(function(q) {
    return '<li>' + q[1] + ': ' + fmtCount(stuck[q[0]] || 0) + '</li>';
  }).join('');
  return '<p class="stats-stuck">&#x26A0; ' + fmtCount(total)
    + ' dead item(s) are still flagged in a work queue</p>'
    + '<ul>' + items + '</ul>'
    + '<p class="stat-label">These rows can never complete; the queues will not drain until they are cleared.</p>';
}

function _renderTotals(t) {
  return '<p><b>Alive:</b> ' + fmtCount(t.alive || 0)
    + ' &nbsp; <b>Dead:</b> ' + fmtCount(t.dead || 0)
    + ' &nbsp; <span class="stat-label">Total: ' + fmtCount(t.total || 0) + '</span></p>';
}

function _renderPriority(b) {
  const queues = [['translation_priority', 'Translation'], ['needs_image', 'Image'], ['needs_web_scrape', 'Web scrape']];
  return queues.map(function(q) {
    const rows = b[q[0]] || [];
    let total = 0;
    rows.forEach(function(r) { total += r.cnt || 0; });
    const detail = rows.map(function(r) {
      return '<li>priority ' + r.prio + ': ' + fmtCount(r.cnt) + '</li>';
    }).join('');
    return '<div class="stat-row"><b>' + q[1] + ' queue:</b> ' + fmtCount(total) + ' waiting'
      + (detail ? '<ul>' + detail + '</ul>' : '') + '</div>';
  }).join('');
}

function _renderStatusCounts(rows) {
  if (!rows || !rows.length) return '<p class="stat-label">(none)</p>';
  return '<ul>' + rows.map(function(r) {
    return '<li>Status ' + r.status + ': ' + fmtCount(r.count) + '</li>';
  }).join('') + '</ul>';
}

function _renderRecency(r) {
  return '<ul><li>Fresh: ' + fmtCount(r.fresh || 0) + '</li>'
    + '<li>Stale: ' + fmtCount(r.stale || 0) + '</li>'
    + '<li>Never attempted: ' + fmtCount(r.blank || 0) + '</li></ul>';
}

function _renderTranslation(t) {
  return '<ul>' + Object.keys(t).map(function(k) {
    return '<li>' + k + ': ' + fmtCount(t[k]) + '</li>';
  }).join('') + '</ul>';
}

function _renderTags(tags) {
  const names = Object.keys(tags);
  if (!names.length) return '<p class="stat-label">No tags recorded.</p>';
  const sorted = names.sort(function(a, b) { return tags[b] - tags[a]; });
  const top = sorted.slice(0, 15).map(function(name) {
    return name + ' (' + fmtCount(tags[name]) + ')';
  }).join(', ');
  return '<p>' + fmtCount(names.length) + ' distinct tags</p>'
    + '<p class="stat-label">Most used: ' + top + (sorted.length > 15 ? ', …' : '') + '</p>';
}

function _renderAppTracking(apps) {
  if (!apps || !apps.length) return '<p class="stat-label">No tracked applications.</p>';
  const rows = apps.map(function(a) {
    return '<tr><td>' + a.appid + '</td><td>' + (a.last_page_scanned || 0) + '</td>'
      + '<td>' + (a.last_cursor || '') + '</td></tr>';
  }).join('');
  return '<table class="stats-table"><thead><tr><th>AppID</th><th>Last page</th><th>Last cursor</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>';
}

function _renderMetricBody(name, value) {
  if (value === null || value === undefined) return '<span class="stat-label">failed</span>';
  if (name === 'totals') return _renderTotals(value);
  if (name === 'high_water') return '<p>' + _fmtTimestamp(value) + '</p>';
  if (name === 'coverage') return _renderCoverage(value);
  if (name === 'stuck_work') return _renderStuck(value);
  if (name === 'status_counts') return _renderStatusCounts(value);
  if (name === 'fetch_recency') return _renderRecency(value);
  if (name === 'translation_status') return _renderTranslation(value);
  if (name === 'priority_breakdowns') return _renderPriority(value);
  if (name === 'tag_counts') return _renderTags(value);
  if (name === 'app_tracking') return _renderAppTracking(value);
  return '<pre style="white-space:pre-wrap;margin:0">' + JSON.stringify(value) + '</pre>';
}

function _intervalFor(ms) {
  return Math.max(STATS_MIN_REFRESH_MS, ms * STATS_REFRESH_FACTOR);
}

function _loadStatsOrder() {
  try {
    const raw = localStorage.getItem(STATS_ORDER_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== STATS_ORDER_VERSION
        || typeof parsed.ms !== 'object' || parsed.ms === null) return {};
    const clean = {};
    Object.keys(parsed.ms).forEach(function(name) {
      const ms = parsed.ms[name];
      if (typeof ms === 'number' && isFinite(ms) && ms >= 0) clean[name] = ms;
    });
    return clean;
  } catch (e) {
    // A corrupt or unreadable store is not worth failing the panel over.
    console.debug('stats order load failed', e);
    return {};
  }
}

function _saveStatsOrder() {
  try {
    localStorage.setItem(STATS_ORDER_KEY, JSON.stringify({v: STATS_ORDER_VERSION, ms: _statsMeasured}));
  } catch (e) {
    console.debug('stats order save failed', e);
  }
}

function _statsOrder() {
  // Seed cost until a duration is known, then the measured cost. The catalogue
  // already arrives in seed order, so unmeasured ties keep that order.
  return _statsCatalogue.slice().sort(function(a, b) {
    const am = (_statsMeasured[a.name] != null) ? _statsMeasured[a.name] : a.seed_ms;
    const bm = (_statsMeasured[b.name] != null) ? _statsMeasured[b.name] : b.seed_ms;
    if (am !== bm) return am - bm;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
}

function _loadMetric(name, token) {
  fetch('/api/metrics/' + encodeURIComponent(name)).then(function(resp) {
    return resp.json();
  }).then(function(data) {
    if (token !== _statsToken) return;  // panel closed or reopened while in flight
    const body = document.querySelector('[data-metric-body="' + name + '"]');
    if (body) body.innerHTML = _renderMetricBody(name, data.value);
    const msEl = document.querySelector('[data-metric-ms="' + name + '"]');
    if (msEl) msEl.textContent = (data.ms != null ? data.ms + ' ms' : '');
    if (typeof data.ms === 'number') {
      _statsMeasured[name] = data.ms;
      _saveStatsOrder();
    }
    // setTimeout rather than setInterval: the next request is armed only once
    // this one has landed, so a metric still computing is never started again.
    _statsTimers[name] = setTimeout(function() {
      if (token !== _statsToken) return;
      _loadMetric(name, token);
    }, _intervalFor(data.ms || 0));
  }).catch(function(e) {
    if (token !== _statsToken) return;
    const body = document.querySelector('[data-metric-body="' + name + '"]');
    if (body) body.innerHTML = '<p class="stat-label">Failed: ' + e.message + '</p>';
    _statsTimers[name] = setTimeout(function() {
      if (token !== _statsToken) return;
      _loadMetric(name, token);
    }, STATS_MIN_REFRESH_MS);
  });
}

function _openStatsPanel() {
  const overlay = document.getElementById('stats-overlay');
  const host = document.getElementById('stats-metrics');
  overlay.style.display = 'block';
  host.innerHTML = '<p>Loading…</p>';
  _statsToken += 1;
  const token = _statsToken;
  Object.keys(_statsTimers).forEach(function(name) { clearTimeout(_statsTimers[name]); });
  _statsTimers = {};
  _statsMeasured = _loadStatsOrder();
  fetch('/api/metrics').then(function(resp) {
    return resp.json();
  }).then(function(cat) {
    if (token !== _statsToken) return;
    _statsCatalogue = cat.metrics || [];
    // One section per metric, each with its own body element to fill.
    host.innerHTML = _statsOrder().map(function(meta) {
      return '<section class="stats-chunk" data-metric="' + meta.name + '">'
        + '<h3>' + _statLabel(meta.name)
        + ' <small class="stats-chunk-ms" data-metric-ms="' + meta.name + '"></small>'
        + '<span class="stats-chunk-note">' + (meta.note || '') + '</span></h3>'
        + '<div class="stats-chunk-body" data-metric-body="' + meta.name + '">'
        + '<p class="stat-label">Computing…</p></div>'
        + '</section>';
    }).join('');
    // Independent requests, deliberately not Promise.all: each chunk draws and
    // arms its own refresh timer as it lands, with no waiting for the slowest.
    _statsCatalogue.forEach(function(meta) { _loadMetric(meta.name, token); });
  }).catch(function(e) {
    if (token !== _statsToken) return;
    host.innerHTML = '<p>Failed to load statistics: ' + e.message + '</p>';
  });
}

function _closeStatsPanel() {
  _statsToken += 1;  // discard every response still in flight
  Object.keys(_statsTimers).forEach(function(name) { clearTimeout(_statsTimers[name]); });
  _statsTimers = {};
  _saveStatsOrder();
  document.getElementById('stats-overlay').style.display = 'none';
}

document.getElementById('btn-stats').onclick = _openStatsPanel;
document.getElementById('stats-close').onclick = _closeStatsPanel;

// ── View window analysis panel ────────────────────────────────────────────
// The web half of the TUI's ctrl+? screen: age-bucketed views, with the knee —
// the first bucket whose median falls below a quarter of the early peak —
// reported as the estimated view window. One request per open or recalculate;
// no polling, because the query is expensive and the data moves slowly.
let _analysisToken = 0;

// The TUI reads its bucket box the same way: fall back to 7 for anything that
// is not an integer and clamp the rest to at least one day, so a typo can never
// reach the endpoint as a zero bucket width.
function _analysisBucketDays(raw) {
  const n = Number(raw);
  if (!Number.isInteger(n)) return 7;
  return Math.max(1, n);
}

function _renderAnalysisSummary(data) {
  const items = fmtCount(data.items_analyzed || 0);
  const buckets = fmtCount((data.buckets || []).length);
  if (data.estimated_window_days == null) {
    // A null knee is not a zero-day window: the curve never fell to a quarter
    // of its early peak, so there is nothing to estimate. Say that rather than
    // printing "~0 days", which would read as a real answer.
    return '<p>Insufficient data to estimate a view window. '
      + '<span class="stat-label">(' + items + ' items analyzed, ' + buckets
      + ' buckets)</span></p>';
  }
  return '<p><b>Estimated view window: ~' + fmtCount(data.estimated_window_days)
    + ' days</b> <span class="stat-label">(' + items + ' items analyzed, '
    + buckets + ' buckets)</span></p>';
}

function _renderAnalysisTable(data) {
  const buckets = data.buckets || [];
  if (!buckets.length) {
    return '<p class="stat-label">No items with recorded views to analyze.</p>';
  }
  let maxMedian = 0;
  buckets.forEach(function(b) { if (b.median > maxMedian) maxMedian = b.median; });
  // A bar is a share of the peak, so the divisor must never be zero even when
  // every bucket's median is.
  if (maxMedian < 1) maxMedian = 1;
  const rows = buckets.map(function(b) {
    const width = (b.median / maxMedian * 100).toFixed(1);
    return '<tr>'
      + '<td>' + b.age_start + '\u2013' + b.age_end + 'd</td>'
      + '<td>' + fmtCount(b.count) + '</td>'
      + '<td>' + fmtCount(b.median) + '</td>'
      + '<td>' + fmtCount(b.p10) + '</td>'
      + '<td>' + fmtCount(b.p90) + '</td>'
      + '<td><div class="analysis-bar-track"><div class="analysis-bar" style="width:' + width + '%"></div></div></td>'
      + '</tr>';
  }).join('');
  return '<table class="stats-table analysis-table"><thead><tr>'
    + '<th>Age range</th><th>Items</th><th>Median views</th><th>P10</th><th>P90</th><th>Relative median</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function _drawAnalysis(data) {
  const summary = document.getElementById('analysis-summary');
  if (summary) summary.innerHTML = _renderAnalysisSummary(data);
  const host = document.getElementById('analysis-table-host');
  if (host) host.innerHTML = _renderAnalysisTable(data);
}

function _loadAnalysis(token) {
  const input = document.getElementById('analysis-bucket-days');
  const bucketDays = _analysisBucketDays(input ? input.value : '');
  return fetch('/api/analysis?bucket_days=' + bucketDays).then(function(resp) {
    return resp.json();
  }).then(function(data) {
    // A stale token means the panel closed or recalculated while this request
    // was in flight; drawing now would repaint something the user has left.
    if (token !== _analysisToken) return;
    _drawAnalysis(data);
  }).catch(function(e) {
    if (token !== _analysisToken) return;
    const summary = document.getElementById('analysis-summary');
    if (summary) summary.innerHTML = '<p class="stat-label">Failed: ' + e.message + '</p>';
    const host = document.getElementById('analysis-table-host');
    if (host) host.innerHTML = '';
  });
}

function _runAnalysis() {
  _analysisToken += 1;  // supersede any request still in flight
  const token = _analysisToken;
  const summary = document.getElementById('analysis-summary');
  if (summary) summary.innerHTML = '<p>Loading…</p>';
  const host = document.getElementById('analysis-table-host');
  if (host) host.innerHTML = '';
  _loadAnalysis(token);
}

function _openAnalysisPanel() {
  const overlay = document.getElementById('analysis-overlay');
  if (!overlay) return;
  const input = document.getElementById('analysis-bucket-days');
  // The TUI mounts a fresh screen at 7 days; so does this panel.
  if (input) input.value = '7';
  overlay.style.display = 'block';
  _runAnalysis();
}

function _closeAnalysisPanel() {
  _analysisToken += 1;  // discard every response still in flight
  const overlay = document.getElementById('analysis-overlay');
  if (overlay) overlay.style.display = 'none';
}

document.getElementById('btn-analysis').onclick = _openAnalysisPanel;
document.getElementById('analysis-close').onclick = _closeAnalysisPanel;
document.getElementById('analysis-recalc').onclick = _runAnalysis;

loadState();
</script>
</body>
