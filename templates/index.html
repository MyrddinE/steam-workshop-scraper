<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="userscript-version" content="10">
<title>Steam Workshop Scraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
:root { --pico-font-size: 85%; }
body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { padding: .5rem 1rem; border-bottom: 1px solid var(--pico-muted-border-color); display: flex; justify-content: space-between; align-items: center; }
main { flex: 1; display: flex; gap: .5rem; padding: .5rem; overflow: hidden; }
#results-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .5rem; overflow-y: auto; align-content: start; flex: 1; min-height: 0; }
.grid-cell { cursor: pointer; padding: .5em; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; display: flex; flex-direction: column; gap: .25em; outline: none; position: relative; }
.grid-cell .grid-spinner { display: none; position: absolute; bottom: 4px; right: 4px; width: 12px; height: 12px; border: 2px solid var(--pico-muted-border-color); border-top-color: #44aa44; border-radius: 50%; animation: spin .6s linear infinite; }
/* The marker's speed says which stage is outstanding and its colour fades with
   it, so a marker that clears in seconds does not look like one that may take
   hours. The durations and colours are mirrored from src/pending.py, and a
   contract test fails if the two ever disagree. */
.grid-cell.pending-image .grid-spinner { animation-duration: 0.6s; border-top-color: #44aa44; }
.grid-cell.pending-translation .grid-spinner { animation-duration: 2.4s; border-top-color: #7f9a7f; }
.grid-cell.pending-web .grid-spinner { animation-duration: 9.6s; border-top-color: #8a8a8a; }
.grid-cell.has-spinner .grid-spinner { display: block; }
/* The owner's subscription marker, top-right. It mirrors .grid-spinner's
   placement at the other corner, and it is a real element carrying a real
   Unicode glyph rather than a pseudo-element: the reader and the TUI see the
   same characters. Its colour is set inline from the payload, which the server
   derives from src/subscription.py, so this rule carries only placement. */
.grid-cell .grid-sub {
  position: absolute; top: 2px; right: 4px;
  font-size: .9rem; line-height: 1;
  background: var(--pico-background-color, #fff);
  padding: 0 .1em; border-radius: 3px; z-index: 1;
}
.grid-cell .grid-sub[data-sub-clickable="1"] { cursor: pointer; }
.grid-cell .grid-sub[data-sub-clickable="0"] { cursor: default; }
.grid-cell:hover { border-color: var(--pico-primary-hover-background); }
.grid-cell:focus-visible { outline: 2px solid #44aa44; outline-offset: 2px; }
.grid-cell.selected { outline: 2px solid #44aa44; outline-offset: 2px; }
.grid-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 3px; background: var(--pico-muted-border-color); }
.grid-img-placeholder { width: 100%; aspect-ratio: 16/10; border-radius: 3px; background: var(--pico-muted-border-color); display: flex; align-items: center; justify-content: center; color: var(--pico-muted-color); font-size: .8rem; }
/* A cell whose image the server has already answered for: 404, 410, or a
   content type that was not a picture. The status is drawn, never fetched.
   container-type makes cqh resolve against this box, so the mark is half the
   box's height on any width; the rem line is the fallback for a browser
   without container queries. */
.grid-img-failed { color: #d33; container-type: size; }
.grid-img-failed-mark { font-size: 2.5rem; font-size: 50cqh; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
.grid-title { font-size: .82rem; font-weight: bold; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.grid-meta { font-size: .7rem; color: var(--pico-muted-color); display: flex; flex-wrap: wrap; gap: .2em .5em; }
.grid-scores { font-size: .7rem; font-weight: bold; display: flex; gap: .5em; }
#right-pane { flex: 0 0 360px; display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--pico-muted-border-color); padding-left: .5rem; }
#search-builder { flex-shrink: 0; margin-bottom: .5rem; }
.filter-row { display: flex; gap: .25rem; align-items: center; margin-bottom: .25rem; }
/* One height for every control in the builder, on the short end. Pico gives
   inputs, selects and buttons different intrinsic heights, so a row came out
   ragged -- the text box noticeably taller than the menus beside it, and the
   stats button taller than the sort menus. The tall ones come down to meet the
   short ones rather than the reverse. Overriding only the vertical box model
   leaves Pico's select chevron, which is drawn with horizontal padding. */
#search-builder select,
#search-builder input,
#search-builder button {
  height: 2.1rem;
  min-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  margin-top: 0;
  margin-bottom: 0;
  box-sizing: border-box;
}
.filter-row select, .filter-row input { padding-left: 4px; padding-right: 4px; }
.filter-row select.field-select { flex: 2; }
.filter-row select.op-select { flex: 2; }
.filter-row input.value-input { flex: 3; }
.filter-row button { padding: 0 6px; min-width: 2rem; }
#detail-pane { flex: 1; overflow-y: auto; min-height: 0; }
#detail-buttons { flex-shrink: 0; border-top: 1px solid var(--pico-muted-border-color); padding: .35rem 0 0 0; display: flex; gap: .25rem; }
.stat-row { margin-bottom: .25rem; }
.stat-label { color: var(--pico-muted-color); }
.stat-wilson { font-weight: bold; }
.wilson-p99 { color: #ffd700; }
.wilson-p99::before { content: '! '; }
.wilson-p99::after { content: ' !'; }
.wilson-p90 { color: #ffd700; }
.wilson-p50 { color: #e0e0e0; }
.wilson-low { color: #888; }
/* Before the percentile cutoffs for this filter set have arrived there is
   nothing to compare a score against, so it gets no colour and makes no claim.
   Rendering it as "low" would be as wrong as rendering it as "top tier". */
.wilson-unknown { color: var(--pico-muted-color); }
.size-small { color: var(--pico-muted-color); }
.size-medium { color: inherit; }
.size-large { color: #ffd700; }
.size-huge { color: #ff6347; }
#port-display { font-size: .8rem; color: var(--pico-muted-color); }
/* The session warning. Not dismissible: it is cleared by fixing the login, not
   by clicking it away, so there is deliberately no close button. It sits above
   the results because the failure is silent otherwise -- subscriptions simply
   stop updating and nothing else on the page looks wrong. */
#session-warning { flex-shrink: 0; display: none; align-items: center; flex-wrap: wrap; gap: .5rem; padding: .35rem .75rem; background: #7f1d1d; color: #fff; font-size: .82rem; }
#session-warning a[role="button"], #session-warning button { width: auto; margin: 0; padding: .15rem .6rem; font-size: .78rem; }
@media (max-width: 768px) {
  main { flex-direction: column; }
  #right-pane { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--pico-muted-border-color); padding-left: 0; padding-top: .5rem; }
  #results-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;font-size:1.2rem">Workshop Scraper</h1>
  <span style="display:flex;align-items:center;gap:.5rem">
    <button id="btn-daemon" style="padding:.2rem .6rem;font-size:.8rem;width:auto;margin:0">&#x2699; Daemon</button>
    <button id="btn-stats" style="padding:.2rem .6rem;font-size:.8rem;width:auto;margin:0" title="Statistics">&#x1F4CA; Stats</button>
    <button id="btn-analysis" style="padding:.2rem .6rem;font-size:.8rem;width:auto;margin:0" title="View window analysis">&#x1F4C8; Analysis</button>
    <span id="port-display"></span>
  </span>
</header>
<!-- The daemon's Steam login has stopped working. The link is the page the
     scraper itself uses, so signing in there mints the cookie it reads; the
     second button re-reads the browser's copy without waiting for the daemon. -->
<div id="session-warning" role="alert">
  <span id="session-warning-text"></span>
  <a id="session-warning-login" href="https://steamcommunity.com/my/" target="_blank" rel="noopener" role="button">Sign in to Steam</a>
  <button id="session-warning-recheck" class="secondary">Recheck</button>
</div>
<main>
  <div id="results-pane">
    <div id="results-grid"></div>
  </div>
  <div id="right-pane">
    <div id="search-builder">
      <div id="filter-rows"></div>
      <div style="display:flex;gap:.25rem;margin-top:.25rem">
        <button id="btn-search" style="flex:2">Search</button>
        <button id="btn-save-filter" title="Save for scraper">&#x1F4BE;</button>
        <button id="btn-and" style="flex:1">AND</button>
        <button id="btn-or" style="flex:1">OR</button>
      </div>
      <div style="display:flex;gap:.25rem;margin-top:.25rem">
        <select id="sort-by" style="flex:2">
          <option value="title">Title</option>
          <option value="file_size">File Size</option>
          <option value="subscriptions">Subscriptions</option>
          <option value="favorited">Favorites</option>
          <option value="views">Views</option>
          <option value="workshop_id">Workshop ID</option>
          <option value="steam_created_at">Created Time</option>
          <option value="steam_updated_at">Updated Time</option>
          <option value="api_fetched_at">Fetched Time</option>
          <option value="wilson_subscription_score">Subscriber Score</option>
          <option value="wilson_favorite_score">Favorite Score</option>
        </select>
        <select id="sort-order" style="flex:1">
          <option value="ASC">ASC</option>
          <option value="DESC">DESC</option>
        </select>
      </div>
    </div>
    <div id="detail-pane">
      <p class="stat-label">Select an item to see details.</p>
    </div>
    <div id="detail-buttons">
      <button onclick="fetch('/api/fetch_new',{method:'POST'}).then(()=>alert('Fetch-new triggered!'))">Fetch New</button>
      <button onclick="doUpdateVisible()">Update Visible</button>
      <button id="btn-clear-pending" onclick="doClearPending()" title="Delete items that were never successfully scraped">Clear Pending</button>
      {% if open_folder_enabled %}
      <button id="btn-open-folder" onclick="openFolderFromDetail()" disabled
              title="Only a subscribed item Steam has downloaded can be opened.">Open Folder (not downloaded)</button>
      {% endif %}
    </div>
  </div>
</main>

<div id="daemon-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:700px;margin:0 auto">
    <h2>Daemon</h2>
    <p id="daemon-status" style="color:var(--pico-muted-color)">Loading...</p>
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
      <button id="daemon-start" style="width:auto">Start</button>
      <button id="daemon-stop" style="width:auto">Stop</button>
      <button id="daemon-restart" style="width:auto">Restart</button>
      <button id="daemon-close" class="secondary" style="width:auto">Close</button>
    </div>
    <pre id="daemon-log" style="height:50vh;overflow-y:auto;padding:.5rem;border:1px solid var(--pico-muted-border-color);border-radius:4px;font-size:.75rem;white-space:pre-wrap"></pre>
  </div>
</div>

<div id="sub-queue-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:600px;margin:0 auto">
    <h2>Auto-Subscribing...</h2>
    <p id="sub-progress" style="color:var(--pico-muted-color)"></p>
    <div id="sub-queue-list"></div>
    <button id="sub-clear-failed" style="margin-top:1rem;display:none">Clear Failed</button>
    <button id="sub-cancel" style="margin-top:1rem">Cancel</button>
  </div>
</div>

<div id="stats-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:900px;margin:0 auto">
    <h2>Statistics</h2>
    <button id="stats-close" class="secondary" style="width:auto;margin-bottom:.75rem">Close</button>
    <div id="stats-metrics"></div>
  </div>
</div>

<div id="analysis-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto;padding:2rem">
  <div style="max-width:900px;margin:0 auto">
    <h2>View Window Analysis</h2>
    <div class="analysis-controls">
      <label for="analysis-bucket-days">Bucket size (days)
        <input id="analysis-bucket-days" type="number" min="1" step="1" value="7">
      </label>
      <button id="analysis-recalc" style="width:auto;margin:0">Recalculate</button>
      <button id="analysis-close" class="secondary" style="width:auto;margin:0">Close</button>
    </div>
    <div id="analysis-summary"></div>
    <div id="analysis-table-host"></div>
  </div>
</div>

<style>
.sub-queue-item { display:flex;align-items:center;gap:.5em;padding:.5em;border-bottom:1px solid var(--pico-muted-border-color); }
.sub-queue-item .spinner { width:1em;height:1em;border:2px solid var(--pico-muted-border-color);border-top-color:#44aa44;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0; }
.sub-queue-item.done { opacity:.5; }
.sub-queue-item .countdown { font-size:.85em;color:var(--pico-muted-color);min-width:3em; }
.sub-queue-item.done .spinner { display:none; }
.sub-queue-item.done .countdown { display:none; }
.sub-queue-item.done::before { content:'\2713 '; color:#44aa44; flex-shrink:0; }
.sub-queue-item.failed .spinner { display:none; }
.sub-queue-item.failed .countdown { display:none; }
.sub-queue-item.failed::before { content:'\2717 '; color:#ff4444; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.translation-notice { color:var(--pico-muted-color);font-style:italic;font-size:.9em;margin:.4em 0; }
.stats-chunk { margin-bottom:1.25rem; }
.stats-chunk h3 { margin-bottom:.35rem; }
.stats-chunk-ms { color:var(--pico-muted-color);font-size:.75em;font-weight:normal; }
.stats-chunk-note { color:var(--pico-muted-color);font-size:.8em;margin-left:.4em;font-weight:normal; }
.stats-chunk-body { margin-top:.2rem; }
.stats-stuck { color:#ff6347;font-weight:bold;margin:.2rem 0; }
.stats-stuck ul { margin:.2rem 0 0 1rem; }
.stats-chunk-body ul { margin:.2rem 0 0 1rem; }
.stats-chunk-body progress { margin:0; }
.stats-table td, .stats-table th { padding:.15rem .5rem .15rem 0; }
/* Tags are the one metric that is a long list rather than a handful of
   numbers, so it scrolls inside a bounded box instead of pushing every
   chunk below it off the screen. */
.stats-scroll { max-height: 20rem; overflow-y: auto; }
.analysis-controls { display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.75rem;flex-wrap:wrap; }
.analysis-controls label { margin:0; }
.analysis-controls input { width:6rem;margin:0; }
/* The bar is the point of the table: it makes the median comparable at a
   glance across buckets whose absolute values differ by orders of magnitude. */
.analysis-table td, .analysis-table th { padding:.15rem .5rem .15rem 0;white-space:nowrap; }
.analysis-bar-track { background:var(--pico-muted-border-color);border-radius:3px;height:.9rem;min-width:120px; }
.analysis-bar { background:#44aa44;height:100%;border-radius:3px; }
</style>

<script>
const WEB_DELAY = {{ web_delay }};
const FILTER_SCHEMA = {{ filter_schema_json | safe }};

// Derived from schema
const ALL_FIELDS = FILTER_SCHEMA.map(f => f.field);
const FIELD_OPS = {};
FILTER_SCHEMA.forEach(f => {
  FIELD_OPS[f.field] = f.ops;
});
const ID_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'id').map(f => f.field);
const NUMERIC_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'number').map(f => f.field);
const TEXT_FIELDS = FILTER_SCHEMA.filter(f => f.type === 'string').map(f => f.field);

let currentOffset = 0, hasMore = true, loading = false, cutoffs = {};
let _cutoffsCache = null, _cutoffsFilterKey = '';
let _subTitleText = 'No cutoff data', _favTitleText = 'No cutoff data';
let _listPollTimer = null;

// The header shows which port this panel answered on. location already knows
// it — it is the port in the address bar — so this reads the page's own origin
// rather than adding a request, and it stays right when the configured port
// changes between loads (there is no baked-in literal to go stale).
function showServerPort() {
  const el = document.getElementById('port-display');
  if (!el) return;
  el.textContent = location.port ? ':' + location.port : '';
}
showServerPort();

function updateOps(row) {
  const field = row.querySelector('.field-select').value;
  const opSelect = row.querySelector('.op-select');
  const cur = opSelect.value;
  const ops = FIELD_OPS[field] || ['contains','does_not_contain'];
  opSelect.innerHTML = ops.map(o => `<option value="${o}">${o.replace(/_/g,' ')}</option>`).join('');
  if (ops.includes(cur)) opSelect.value = cur;
}

// `initial` lets a caller (the author jump) build a row that already carries a
// filter. The field has to be chosen before updateOps, because updateOps
// rebuilds the operator list for the current field and would otherwise be left
// showing the operators of the default field.
function addRow(logic, initial) {
  const container = document.getElementById('filter-rows');
  const div = document.createElement('div');
  div.className = 'filter-row';
  if (logic) div.dataset.logic = logic;
  div.innerHTML = `
    <select class="field-select" onchange="updateOps(this.parentElement)">${ALL_FIELDS.map(f => `<option value="${f}">${f}</option>`).join('')}</select>
    <select class="op-select"></select>
    <input class="value-input" type="text" placeholder="value">
    <button onclick="removeRow(this.parentElement)">&#x2715;</button>
  `;
  container.appendChild(div);
  if (initial && initial.field) div.querySelector('.field-select').value = initial.field;
  updateOps(div);
  if (initial) {
    if (initial.op) div.querySelector('.op-select').value = initial.op;
    if (initial.value != null) div.querySelector('.value-input').value = initial.value;
  }
}

function removeRow(row) { row.remove(); }

function getFilters() {
  const rows = document.querySelectorAll('#filter-rows .filter-row');
  const filters = [];
  rows.forEach(r => {
    const op = r.querySelector('.op-select').value;
    let val = r.querySelector('.value-input').value;
    if (op === 'percentile') {
      const n = parseInt(val, 10);
      if (isNaN(n)) val = '0';
      else val = String(Math.max(0, Math.min(99, n)));
      r.querySelector('.value-input').value = val;
    }
    const f = {field: r.querySelector('.field-select').value, op, value: val};
    if (r.dataset.logic) f.logic = r.dataset.logic;
    filters.push(f);
  });
  return filters;
}

async function loadCutoffs() {
  const filters = getFilters();
  const key = JSON.stringify(filters);
  // A cache hit has to restore `cutoffs` too: a search now clears it before the
  // rows are drawn, so returning early without assigning would leave the grid
  // colourless on a repeat of the same filter set.
  if (key === _cutoffsFilterKey && _cutoffsCache !== null) { cutoffs = _cutoffsCache; return; }
  const resp = await fetch('/api/cutoffs', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters})});
  cutoffs = await resp.json();
  if (cutoffs && typeof cutoffs === 'object' && Object.keys(cutoffs).length) {
    _cutoffsCache = cutoffs;
    _cutoffsFilterKey = key;
  } else {
    cutoffs = _cutoffsCache || {};
  }

  const sf = (k) => (cutoffs[k] != null) ? (cutoffs[k]*100).toFixed(1) + '%' : '?%';
  _subTitleText = 'p50=' + sf('wilson_subscription_p50') + ' p90=' + sf('wilson_subscription_p90') + ' p99=' + sf('wilson_subscription_p99') + ' [' + sf('wilson_subscription_min') + '..' + sf('wilson_subscription_max') + ']';
  _favTitleText  = 'p50=' + sf('wilson_favorite_p50') + ' p90=' + sf('wilson_favorite_p90') + ' p99=' + sf('wilson_favorite_p99') + ' [' + sf('wilson_favorite_min') + '..' + sf('wilson_favorite_max') + ']';
}

function wClass(score, key) {
  if (score == null) return 'wilson-low';
  // Nothing to compare against yet: see `.wilson-unknown`.
  if (!Object.keys(cutoffs).length) return 'wilson-unknown';
  const p99 = cutoffs[key + '_p99'] || 0;
  const p90 = cutoffs[key + '_p90'] || 0;
  const p50 = cutoffs[key + '_p50'] || 0;
  if (score >= p99) return 'wilson-p99';
  if (score >= p90) return 'wilson-p90';
  if (score >= p50) return 'wilson-p50';
  return 'wilson-low';
}

// Re-colour what is already on screen once the cutoffs land. The scores are kept
// on the spans as data attributes so this needs no re-render and no refetch --
// the rows were drawn before the cutoffs arrived, which is the whole point.
function _applyCutoffColours() {
  document.querySelectorAll('[data-wilson]').forEach(el => {
    const raw = el.getAttribute('data-score');
    const score = (raw == null || raw === '') ? null : Number(raw);
    el.className = wClass(Number.isNaN(score) ? null : score, el.getAttribute('data-wilson'));
  });
}

// The cutoff query is expensive and decides only colour, so it never holds up
// the results. It used to be awaited between clearing the grid and fetching the
// first page, which blanked the pane for as long as it took.
async function _refreshCutoffs() {
  try {
    await loadCutoffs();
    _applyCutoffColours();
  } catch (e) {
    console.debug('Cutoff refresh failed; scores stay uncoloured', e);
  }
}

function fmtCount(n) {
  if (!n || n===0) return '0';
  n = Number(n);
  if (n < 1000) return String(n);
  if (n < 1000000) { const v=n/1000; return n<10000?v.toFixed(2)+'K':n<100000?v.toFixed(1)+'K':Math.round(v)+'K'; }
  const v=n/1000000; return n<10000000?v.toFixed(2)+'M':n<100000000?v.toFixed(1)+'M':Math.round(v)+'M';
}

// Exact digits, grouped. fmtCount above is right for a card's view count, where
// the magnitude is all that matters, but it reports 5,000 as "5.00K" -- which
// loses the number the tag table exists to show. The locale is pinned so the
// grouping reads the same for everyone, matching the TUI's f"{count:,}".
function fmtExact(n) {
  return Number(n).toLocaleString('en-US');
}

function fmtSize(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 10) return mb.toFixed(2) + ' MB';
  if (mb < 100) return mb.toFixed(1) + ' MB';
  if (mb < 1000) return mb.toFixed(0) + ' MB';
  const gb = mb / 1024;
  if (gb < 10) return gb.toFixed(2) + ' GB';
  if (gb < 100) return gb.toFixed(1) + ' GB';
  return gb.toFixed(0) + ' GB';
}

function sizeClass(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  if (mb >= 10000) return 'size-huge';
  if (mb >= 1000) return 'size-large';
  if (mb >= 100) return 'size-medium';
  return 'size-small';
}

async function doSearch(reset = true) {
  if (loading) return;
  loading = true;
  // A reset search starts a new result set, so an item selected in the old one
  // is not a selection any more; keeping it would send restore hunting for a
  // row that is no longer there.
  if (reset) {
    _stopListPoll();
    currentOffset = 0;
    hasMore = true;
    _selectedWid = null;
    document.getElementById('results-grid').innerHTML = '';
    // Drop to the neutral colour and fetch the cutoffs in the background. They
    // decide colour only, and colouring this filter set with the previous set's
    // percentiles would be worse than not colouring it.
    cutoffs = {};
    _refreshCutoffs();
  }

  const filters = getFilters();
  const resp = await fetch('/api/search', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({filters, sort_by: document.getElementById('sort-by').value, sort_order: document.getElementById('sort-order').value, offset: currentOffset, limit: 50})
  });
  const items = await resp.json();

  const grid = document.getElementById('results-grid');
  items.forEach((item, idx) => {
    const title = item.title_en || item.title || 'Untitled';
    const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
    const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;
    const size = fmtSize(item.file_size);

    const imgHtml = _imageCellHtml(item);

    const div = document.createElement('div');
    div.className = 'grid-cell';
    div.setAttribute('data-wid', item.workshop_id);
    div.setAttribute('tabindex', '0');
    if (idx === 0) div.setAttribute('data-batch-first', '1');
    div.innerHTML = `${imgHtml}
      <div class="grid-title">${title}</div>
      <div class="grid-meta"><span class="${sizeClass(item.file_size)}">${size}</span></div>
      <div class="grid-scores">
        <span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}" data-wilson="wilson_subscription" data-score="${item.wilson_subscription_score ?? ''}">S ${wss!=null?wss+'%':'—'}</span>
        <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}" data-wilson="wilson_favorite" data-score="${item.wilson_favorite_score ?? ''}">F ${wfs!=null?wfs+'%':'—'}</span>
      </div>
      <div class="grid-sub"></div>
      <div class="grid-spinner"></div>`;
    _applyPending(div, item);
    // The marker is written into the DOM rather than attached as a handler
    // closure so the `s` shortcut can update an existing cell in place without
    // a re-render, and so showSubscriptionMarker is the one writer.
    _applySub(div.querySelector('.grid-sub'), item);
    // The cell opens the detail pane. The marker sits inside it, so the
    // marker's own click must stop propagation or a queue toggle would also
    // drag the pane to the item.
    div.onclick = () => showDetail(item.workshop_id);
    grid.appendChild(div);
  });

  currentOffset += items.length;
  hasMore = items.length >= 50;
  loading = false;

  if (_listNeedsPoll(items)) {
    _startListPoll(filters, document.getElementById('sort-by').value, document.getElementById('sort-order').value);
  }
  _placeSentinel();
  // A reset re-establishes the committed filter/sort view; save it once the
  // result set it describes is on screen.
  if (reset) _saveViewState();
}

function _placeSentinel() {
  if (loading || !hasMore) return;
  let sentinel = document.getElementById('scroll-sentinel');
  if (!sentinel) {
    sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
  } else {
    sentinel.remove();
  }

  const first = document.querySelector('.grid-cell[data-batch-first]');
  if (!first) return;
  first.removeAttribute('data-batch-first');

  const rect = first.getBoundingClientRect();
  if (rect.top < window.innerHeight) {
    setTimeout(() => doSearch(false), 0);
    return;
  }

  first.parentNode.insertBefore(sentinel, first);
  _scrollObserver.observe(sentinel);
}

// What the server recorded for this item's image. image_state comes from
// src/images.py, which owns the rule about what may be treated as a picture.
// The numeric fallback is defence in depth only: a status marker must never
// become a URL even if a payload somehow predates the field.
function _imageState(item) {
  if (item.image_state) return item.image_state;
  const ext = item.image_extension;
  if (!ext) return 'absent';
  return /^\d+$/.test(ext) ? 'permanent' : 'present';
}

function _imageCellHtml(item) {
  const state = _imageState(item);
  if (state === 'present') {
    return `<img class="grid-img" src="/images/${item.workshop_id}.${item.image_extension}" loading="lazy" alt="">`;
  }
  if (state !== 'absent') {
    // Answered: draw the answer instead of asking the browser for a file that
    // was never written.
    return `<div class="grid-img-placeholder grid-img-failed" title="Image unavailable">`
      + `<span class="grid-img-failed-mark">${_escapeHtml(item.image_extension)}</span></div>`;
  }
  const label = (item.needs_image > 0) ? 'pending' : 'no image';
  return `<div class="grid-img-placeholder">${label}</div>`;
}

// Which stage this item's marker should show, or null. Fastest first: a marker
// that is about to clear says so rather than hiding behind a slower stage, and
// the slow grey one is the one that must not nag. Mirrors src/pending.py.
// api_priority is deliberately absent: a list only shows items the API has
// already returned, so a pending refresh is not content anyone is waiting on.
function _pendingStage(item) {
  if (item.needs_image >= 5 && !item.image_resolved) return 'image';
  if (item.translation_priority >= 5) return 'translation';
  if (item.needs_web_scrape >= 5) return 'web';
  return null;
}

// What the stage's marker means, in words, for its title. The wording is kept
// in src/pending.py beside the stage's speed and colour -- the TUI draws the
// same state and has no hover, so a table that lived only here could describe
// it differently. tests/test_pending.py holds this copy to that table.
function _pendingLabel(stage) {
  if (stage === 'image') return 'Waiting for the image';
  if (stage === 'translation') return 'Waiting for the translation';
  if (stage === 'web') return 'Waiting for the web scrape';
  return '';
}

function _applyPending(el, item) {
  const stage = _pendingStage(item);
  ['image', 'translation', 'web'].forEach(function(name) {
    el.classList.toggle('pending-' + name, stage === name);
  });
  el.classList.toggle('has-spinner', stage !== null);
  // The marker is the only part of the row that knows which stage is set, so
  // the wording goes on it here; an empty label clears a stale tooltip when the
  // stage is gone.
  const spinner = el.querySelector('.grid-spinner');
  if (spinner) spinner.title = _pendingLabel(stage);
}

// ── the owner's subscription marker ──────────────────────────────────────────
//
// Four states (subscribed / pending / previously / never), with glyph, colour,
// tooltip and clickability all computed by the server from src/subscription.py
// and carried on the payload. The page deliberately holds no table of its own:
// the TUI draws the same four states from the same module, and a contract test
// holds this template to it. `subscription_state` is only used to set the
// data attribute the click reads, because a handler needs to know whether the
// click does anything without re-parsing its own text.
function showSubscriptionMarker(item) {
  return `<div class="grid-sub" data-sub-state="${item.subscription_state}"`
    + ` data-sub-clickable="${item.subscription_clickable ? 1 : 0}"`
    + ` data-wid="${item.workshop_id}"`
    + ` style="color: ${item.subscription_colour}"`
    + ` title="${_escapeHtml(item.subscription_tooltip)}"`
    // The handler lives on the element itself, like every other cell control on
    // this page. It must be called with the element: the `s` shortcut updates a
    // cell in place and has no event to hand it.
    + ` onclick="onSubMarkerClick(event, this)">`
    + `${item.subscription_glyph}</div>`;
}

function _applySub(el, item) {
  if (!el) return;
  el.setAttribute('data-sub-state', item.subscription_state);
  el.setAttribute('data-sub-clickable', item.subscription_clickable ? '1' : '0');
  el.setAttribute('data-wid', item.workshop_id);
  el.style.color = item.subscription_colour;
  // The glyph is real text, not CSS content, so the reader (and a test) can see
  // which of the four states a row is in.
  el.textContent = item.subscription_glyph;
  // title is an HTML attribute, so the tooltip travels through the same escape
  // the rest of the pane's text uses.
  el.setAttribute('title', item.subscription_tooltip);
}

// Clicking the marker toggles the queue for the three states that have an
// action. `subscribed` sends nothing: the only action available would be an
// unsubscribe, and an accidental unsubscribe is not wanted.
function onSubMarkerClick(event, el) {
  // The cell underneath opens the detail pane, so a click on the marker must
  // stop propagating or a queue toggle would also open the pane.
  if (event) event.stopPropagation();
  el = el || (event && event.currentTarget);
  if (!el) return;
  if (el.getAttribute('data-sub-clickable') !== '1') return;
  const wid = parseInt(el.getAttribute('data-wid'), 10);
  if (!isNaN(wid)) toggleDetailQueue(wid);
}

// ── opening a downloaded item's folder ───────────────────────────────────────
//
// Windows-only: the button is not rendered and the `o` shortcut is not bound
// off Windows, and the route refuses anyway. Explorer opens on the host running
// the server, not in the browser, because the POST is handled there.
function _refreshOpenFolderButton(item) {
  const btn = document.getElementById('btn-open-folder');
  if (!btn) return;
  const green = !!item && item.subscription_state === 'downloaded';
  btn.disabled = !green;
  btn.textContent = green ? 'Open Folder' : 'Open Folder (not downloaded)';
  btn.title = green
    ? "Open this item's workshop folder in Explorer on the machine running the server."
    : 'Only a subscribed item Steam has downloaded can be opened.';
}

async function openFolder(wid) {
  try {
    const resp = await fetch('/api/open_folder/' + wid, {method: 'POST'});
    const data = await resp.json().catch(() => ({}));
    // The route reports refusals (not green, folder missing, not Windows) with
    // a message; showing it is the same "say why" the disabled button carries.
    if (!data.ok) alert(data.message || 'Could not open the folder.');
  } catch (e) {
    alert('Open folder failed: ' + e.message);
  }
}

function openFolderFromDetail() {
  if (_currentDetail) openFolder(_currentDetail.workshop_id);
}

function _listNeedsPoll(items) {
  for (const item of items) {
    // A stage spinner moves on its own; a subscription marker moves when a
    // subscribe lands, which the database records and only this poll re-reads.
    if (_pendingStage(item) !== null || item.subscription_state === 'pending') return true;
  }
  return false;
}

function _startListPoll(filters, sortBy, sortOrder) {
  _stopListPoll();

  async function tick() {
    if (!_listPollTimer) return;  // stopped during fetch
    let pending = [];
    try {
      const grid = document.getElementById('results-grid');
      // No grid is not a transient failure: there is nothing to poll.
      if (!grid) { _stopListPoll(); return; }
      // A stage spinner needs re-reading, but so does a row whose subscription
      // marker is still `pending`: a subscribe can land behind the cell's back
      // and that row has no spinner to be found by. Deciding here from the
      // rendered state means the marker is refreshed from the database, so no
      // writer of the flag -- the userscript's /api/subscribed, this page's own
      // cancel/clear calls, or /api/subscribe -- can bypass the refresh.
      grid.querySelectorAll('.grid-cell[data-wid]').forEach(el => {
        const sub = el.querySelector('.grid-sub');
        if (el.classList.contains('has-spinner') ||
            (sub && sub.getAttribute('data-sub-state') === 'pending')) {
          pending.push(parseInt(el.getAttribute('data-wid'), 10));
        }
      });
      if (!pending.length) { _stopListPoll(); return; }

      const resp = await fetch('/api/items', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: pending})
      });
      if (!resp.ok) {
        // A 500 from a locked database is transient. Fall through to the
        // re-arm below so the next tick retries; treating a failed response as
        // a stop used to freeze every pending marker for the rest of the
        // session.
      } else {
        const items = await resp.json();
        if (Array.isArray(items)) {
          items.forEach(item => {
            const el = grid.querySelector(`.grid-cell[data-wid="${item.workshop_id}"]`);
            if (!el) return;
            const title = item.title_en || item.title || 'Untitled';
            const titleEl = el.querySelector('.grid-title');
            if (titleEl) titleEl.textContent = title;
            if (!el.querySelector('.grid-img') && !el.querySelector('.grid-img-failed')) {
              const ph = el.querySelector('.grid-img-placeholder');
              if (ph && _imageState(item) !== 'absent') ph.outerHTML = _imageCellHtml(item);
            }
            _applyPending(el, item);
            // The poll also carries the subscription columns, and /api/subscribed
            // may have stamped them behind this cell's back, so the marker is
            // refreshed from the same payload.
            _applySub(el.querySelector('.grid-sub'), item);
            const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
            const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;
            const scores = el.querySelector('.grid-scores');
            if (scores) scores.innerHTML = `
              <span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}" data-wilson="wilson_subscription" data-score="${item.wilson_subscription_score ?? ''}">S ${wss!=null?wss+'%':'—'}</span>
              <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}" data-wilson="wilson_favorite" data-score="${item.wilson_favorite_score ?? ''}">F ${wfs!=null?wfs+'%':'—'}</span>`;
          });
        }
      }
    } catch(e) { console.debug('List poll error', e); /* keep trying */ }
    // Re-arm whatever the tick met, so one failed read is a skipped tick rather
    // than the end of the poll; `_stopListPoll` (checked above) is the only exit.
    if (!_listPollTimer) return;
    const delay = Math.max(1, Math.log2(pending.length)) * 1000;
    _listPollTimer = setTimeout(tick, delay);
  }

  _listPollTimer = setTimeout(tick, 0);
}

function _stopListPoll() {
  if (_listPollTimer) {
    clearTimeout(_listPollTimer);
    _listPollTimer = null;
    document.querySelectorAll('.grid-img-placeholder:not(.grid-img-failed)').forEach(ph => {
      if (ph.textContent.startsWith('pending')) ph.textContent = 'no image';
    });
  }
}

let _showTranslated = true;   // mirrors DetailsPane.show_translated in the TUI
let _currentDetail = null;    // cached so the toggle re-renders without a refetch

function toggleTranslation() {
  _showTranslated = !_showTranslated;
  if (_currentDetail) renderDetail(_currentDetail);
}

// Web equivalent of the TUI's `btn-jump-author`: set an Author ID "is" filter to
// the item's creator and re-run the search. It adds an ordinary filter row
// through addRow rather than replacing the builder's contents, which is why
// there is no single-creator mode here: removing the author row and searching
// again restores the previous view, with no in-memory snapshot that a detail
// re-render could lose and no Return button to keep in step.
function jumpToAuthor(creator) {
  if (creator == null || creator === '') return;
  const container = document.getElementById('filter-rows');
  let row = null;
  container.querySelectorAll('.filter-row').forEach(r => {
    if (r.querySelector('.field-select').value === 'Author ID') row = r;
  });
  if (row) {
    // Reuse an existing Author ID row instead of stacking a second one that
    // would contradict it (an item cannot be by two creators at once).
    row.querySelector('.op-select').value = 'is';
    row.querySelector('.value-input').value = String(creator);
  } else {
    addRow(undefined, {field: 'Author ID', op: 'is', value: String(creator)});
  }
  doSearch(true);
}

function renderDetail(item) {
  _currentDetail = item;
  const pane = document.getElementById('detail-pane');
  // Only an item that actually has a stored translation can be shown either
  // way; otherwise the original is the only text there is.
  const translated = _showTranslated && !!item.has_translation;
  const title = translated
    ? (item.display_title || 'N/A')
    : (item.display_title_original || 'N/A');
  const creator = translated
    ? (item.personaname_en || item.personaname || item.creator || 'N/A')
    : (item.personaname || item.creator || 'N/A');
  // The server sends the creator ID as a string: a SteamID64 runs to seventeen
  // digits, past the range a JavaScript number holds exactly, so a numeric
  // field would silently round and the filter would name a different account.
  const creatorId = item.creator_id != null ? String(item.creator_id) : '';
  const creatorHtml = creatorId
    ? `<button onclick="jumpToAuthor('${creatorId}');return false;" style="padding:0;margin:0;width:auto;background:none;border:none;color:var(--pico-primary);text-decoration:underline;font-weight:bold;display:inline" title="Show all items by this creator">${creator}</button>`
    : `<b>${creator}</b>`;
  const url = `https://steamcommunity.com/sharedfiles/filedetails/?id=${item.workshop_id}`;

  const wfs = item.wilson_favorite_score != null ? (item.wilson_favorite_score*100).toFixed(1) : null;
  const wss = item.wilson_subscription_score != null ? (item.wilson_subscription_score*100).toFixed(1) : null;

  const subs = item.subscriptions||0, lsubs = item.lifetime_subscriptions||0;
  const favs = item.favorited||0, lfavs = item.lifetime_favorited||0;
  const created = item.steam_created_at ? new Date(item.steam_created_at*1000).toISOString().slice(0,10) : 'N/A';
  const updated = item.steam_updated_at && item.steam_updated_at !== item.steam_created_at ? new Date(item.steam_updated_at*1000).toISOString().slice(0,10) : null;
  const tags = (()=>{
    const raw = item.tags || '';
    if (!raw) return 'None';
    if (raw.startsWith('[')) {
      try { const t = JSON.parse(raw); return Array.isArray(t) ? t.join(', ') : 'None'; }
      catch(e) { console.debug('Tag JSON parse failed', e); return 'None'; }
    }
    return raw;
  })();
  const size = fmtSize(item.file_size);
  const sc = sizeClass(item.file_size);

  const fmtTs = (ts) => ts ? new Date(ts*1000).toISOString().slice(0,19).replace('T',' ') : 'N/A';
  const tooltip = [
    `Filename: ${item.filename || 'N/A'}`,
    `App Name: ${item.app_name || 'N/A'}`,
    `Creator AppID: ${item.creator_appid || 'N/A'}`,
    `Consumer AppID: ${item.consumer_appid || 'N/A'}`,
    `File Type: ${item.file_type ?? 'N/A'}`,
    `Visibility: ${item.visibility ?? 'N/A'}`,
    `Banned: ${item.banned ? 'Yes' + (item.ban_reason ? ' — ' + item.ban_reason : '') : 'No'}`,
    `Status: ${item.status ?? 'N/A'}`,
    `Translation Priority: ${item.translation_priority || 0}`,
    `Needs Web Scrape: ${item.needs_web_scrape || 0}`,
    `Needs Image: ${item.needs_image || 0}`,
    `first_seen_at: ${fmtTs(item.first_seen_at)}`,
    `api_fetched_at: ${fmtTs(item.api_fetched_at)}`,
    `scrape_version: ${fmtTs(item.scrape_version)}`,
    `translate_version: ${fmtTs(item.translate_version)}`,
    `hcontent_file: ${item.hcontent_file || 'N/A'}`,
    `hcontent_preview: ${item.hcontent_preview || 'N/A'}`,
  ].join('&#10;');

  // The original view falls back to the untranslated short description, so a
  // missing extended description never leaks translated text into it.
  let desc, fallback;
  if (translated) {
    desc = item.description_html || '';
    fallback = item.short_description_en || item.short_description;
  } else {
    desc = item.description_html_original || '';
    fallback = item.short_description;
  }
  if (!desc && fallback) desc = '<p>' + fallback + '</p>';

  const toggle = item.has_translation
    ? `<button onclick="toggleTranslation();return false;">${_showTranslated ? 'Show Original' : 'Show Translation'}</button>`
    : '';
  // The subscription marker is the queue control now: it sits immediately
  // before the title, where it reads as status next to the item's identity, and
  // clicking it toggles the queue for the three states that have an action.
  // The old Queue/Unqueue button pair is gone rather than kept beside it -- two
  // indicators of the same flag is exactly what this replaced.
  const subMarker = showSubscriptionMarker(item);
  // Matches the TUI, which notes a pending translation only while there is no
  // stored one yet.
  const notice = ((item.translation_priority || 0) > 0 && !item.translate_version)
    ? '<p class="translation-notice">Translation requested, currently in queue&hellip;</p>'
    : '';

  pane.innerHTML = `
    <h2>${subMarker}<a href="${url}" target="_blank" title="${tooltip}">${title}</a></h2>
    <p>by ${creatorHtml} &mdash; <small>Workshop ID: ${item.workshop_id}</small></p>
    <p class="stat-wilson"><span class="${wClass(item.wilson_subscription_score,'wilson_subscription')}" data-wilson="wilson_subscription" data-score="${item.wilson_subscription_score ?? ''}" title="${_subTitleText}">Subscriber Score: ${wss!=null?wss+'%':'N/A'}</span> &nbsp; <span class="${wClass(item.wilson_favorite_score,'wilson_favorite')}" data-wilson="wilson_favorite" data-score="${item.wilson_favorite_score ?? ''}" title="${_favTitleText}">Favorite Score: ${wfs!=null?wfs+'%':'N/A'}</span></p>
    <div class="stat-row"><span class="stat-label">Created:</span> ${created}</div>
    <div class="stat-row"><span class="stat-label">Size:</span> <span class="${sc}">${size || 'N/A'}</span></div>
    ${updated ? `<div class="stat-row"><span class="stat-label">Updated:</span> ${updated}</div>` : ''}
    <div class="stat-row"><span class="stat-label">Views:</span> ${fmtCount(item.views || 0)}</div>
    <div class="stat-row"><span class="stat-label">Subs:</span> ${fmtCount(subs)} / ${fmtCount(lsubs)}</div>
    <div class="stat-row"><span class="stat-label">Favs:</span> ${fmtCount(favs)} / ${fmtCount(lfavs)}</div>
    <div class="stat-row"><span class="stat-label">Tags:</span> <small>${tags}</small></div>
    <p><button onclick="doSubscribe(${item.workshop_id}, ${item.consumer_appid || 0});return false;">Subscribe</button> ${toggle}</p>
    ${notice}
    ${desc ? '<div style="border-left:3px solid var(--pico-muted-border-color);padding-left:.5rem;margin-top:.5rem">'+desc+'</div>' : ''}
  `;
  // The folder control lives in the static bottom bar, so it follows whichever
  // item the pane is showing.
  _refreshOpenFolderButton(item);
}

// /api/toggle_sub answers only {ok: true} and says nothing about which way the
// flag moved, so read the item back instead of flipping a cached guess. The `s`
// shortcut and the subscribe drain's /api/subscribed calls change the same flag
// without going through this pane, so a guess could name the wrong next action.
// Rendering from the returned payload (not from a class on the old DOM) is also
// what lets the 3-second translation poll re-render afterwards without undoing
// the toggle.
async function toggleDetailQueue(wid) {
  let resp;
  try {
    resp = await fetch('/api/toggle_sub/' + wid, {method: 'POST'});
  } catch (e) {
    alert('Queue update failed: ' + e.message);
    return;
  }
  if (!resp.ok) {
    alert('Queue update failed: ' + resp.status + ' ' + resp.statusText);
    return;
  }
  try {
    // Read-only route: reading the state back must not re-arm the fetch queue.
    const detail = await fetch('/api/item/' + wid);
    if (!detail.ok) return;
    const item = await detail.json();
    if (item.error) return;
    if (_currentDetail && _currentDetail.workshop_id === wid) renderDetail(item);
    // Keep the matching grid cell's marker in step, as pressing `s` on that
    // cell would. _applySub is the one writer, so the cell shows whatever the
    // server said rather than a locally flipped guess.
    const cell = document.querySelector(`#results-grid .grid-cell[data-wid="${wid}"]`);
    if (cell) _applySub(cell.querySelector('.grid-sub'), item);
    // A row queued here now carries a marker that can change without this
    // pane's help: the subscribe lands in the database. The list poll is what
    // re-reads such a cell, and a row queued after the search rendered was
    // never seen by _listNeedsPoll, so the transition starts it.
    if (item.subscription_state === 'pending') _startListPoll([], '', '');
  } catch (e) { console.debug('Queue state refresh failed', e); }
}

let _detailPollWid = null, _detailPollTimer = null;

function _detailNeedsPoll(item) {
  return (item.translation_priority || 0) > 0;
}

function _startDetailPoll(wid, item) {
  _stopDetailPoll();
  if (!_detailNeedsPoll(item)) return;
  _detailPollWid = wid;
  _detailPollTimer = setInterval(async () => {
    try {
      // Read-only: this polls every 3s, so it must never re-arm the fetch queue.
      const resp = await fetch('/api/item/' + wid);
      if (wid !== _detailPollWid) { _stopDetailPoll(); return; }
      // A 404 is the item itself: there is nothing left to follow. Any other
      // failure -- a 500 from a locked database, most of all -- is transient,
      // so return without stopping and let the interval retry next tick.
      // Stopping here used to leave the pane frozen for the rest of the session
      // after one lock held by the daemon.
      if (resp.status === 404) { _stopDetailPoll(); return; }
      if (!resp.ok) { return; }
      const updated = await resp.json();
      if (updated.error) { _stopDetailPoll(); return; }
      if (!_detailNeedsPoll(updated)) {
        renderDetail(updated);
        _stopDetailPoll();
      }
    } catch(e) { console.debug('Detail poll error', e); /* keep trying */ }
  }, 3000);
}

function _stopDetailPoll() {
  if (_detailPollTimer) { clearInterval(_detailPollTimer); _detailPollTimer = null; }
  _detailPollWid = null;
}

async function showDetail(wid) {
  _stopDetailPoll();
  const pane = document.getElementById('detail-pane');
  pane.innerHTML = '<p>Loading...</p>';
  try {
    // Opening a pane is the one path that applies detail priority. The 3-second
    // poll below uses the read-only route, so it cannot re-queue the item.
    const resp = await fetch('/api/item/' + wid + '/open', {method: 'POST'});
    if (!resp.ok) {
      pane.innerHTML = `<p>Error loading item ${wid}: ${resp.status} ${resp.statusText}</p>`;
      return;
    }
    const item = await resp.json();
    if (item.error) { pane.innerHTML = '<p>Item not found.</p>'; return; }

  renderDetail(item);
  document.querySelectorAll('#results-grid .grid-cell').forEach(el => el.classList.remove('selected'));
  const cell = document.querySelector(`#results-grid .grid-cell[data-wid="${wid}"]`);
  if (cell) { cell.classList.add('selected'); cell.focus(); }
  _selectedWid = wid;
  _startDetailPoll(wid, item);
  _saveViewState();
  } catch(e) { pane.innerHTML = '<p>Error loading detail: ' + e.message + '</p>'; }
}

// ── View state persistence ────────────────────────────────────────────────
// The browser's own view -- filter rows, sort, the open item, the scroll
// position -- is per-browser layout, not scraper configuration. `.tui_state.yaml`
// has a different shape and is rewritten by the TUI on its own schedule, so
// sharing the file would have each front end overwrite fields the other does
// not understand. Browser storage is the natural home. The stored entry is
// versioned and shape-checked exactly like the statistics panel's ordering
// entry, so a stale build's record is ignored rather than trusted.
const VIEW_STATE_KEY = 'view.state.v1';
const VIEW_STATE_VERSION = 1;
// Restoration pages through the result set to reach a saved scroll position,
// but only this far: an item thousands of rows down is not worth a page load's
// worth of requests just to re-open its pane.
const MAX_RESTORE_BATCHES = 40;

let _selectedWid = null;    // workshop_id whose detail pane is open
let _viewSaveTimer = null;  // throttles the scroll listener's writes
let _restoringView = false; // suppresses saves while loadState restores

function _loadViewState() {
  try {
    const raw = localStorage.getItem(VIEW_STATE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== VIEW_STATE_VERSION || !Array.isArray(parsed.filters)) return null;
    const filters = [];
    parsed.filters.forEach(function(f) {
      if (!f || typeof f.field !== 'string' || typeof f.op !== 'string') return;
      // A field the schema no longer has would render as a blank dropdown;
      // drop it rather than show a filter that cannot be edited.
      if (ALL_FIELDS.indexOf(f.field) === -1) return;
      const entry = {field: f.field, op: f.op, value: f.value == null ? '' : String(f.value)};
      if (typeof f.logic === 'string') entry.logic = f.logic;
      filters.push(entry);
    });
    return {
      filters: filters,
      sort_by: typeof parsed.sort_by === 'string' ? parsed.sort_by : '',
      sort_order: typeof parsed.sort_order === 'string' ? parsed.sort_order : '',
      selected: (typeof parsed.selected === 'number' && isFinite(parsed.selected)) ? parsed.selected : null,
      scroll: (typeof parsed.scroll === 'number' && isFinite(parsed.scroll) && parsed.scroll > 0) ? parsed.scroll : 0,
    };
  } catch (e) {
    // A corrupt entry is not worth failing the page over.
    console.debug('view state load failed', e);
    return null;
  }
}

function _saveViewState() {
  if (_restoringView) return;
  try {
    const grid = document.getElementById('results-grid');
    localStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      v: VIEW_STATE_VERSION,
      filters: getFilters(),
      sort_by: document.getElementById('sort-by').value,
      sort_order: document.getElementById('sort-order').value,
      selected: _selectedWid,
      scroll: grid ? grid.scrollTop : 0,
    }));
  } catch (e) {
    console.debug('view state save failed', e);
  }
}

function _applyFilters(filters) {
  const container = document.getElementById('filter-rows');
  container.innerHTML = '';
  filters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'filter-row';
    if (i > 0 && f.logic) div.dataset.logic = f.logic;
    div.innerHTML = `
      <select class="field-select" onchange="updateOps(this.parentElement)">${ALL_FIELDS.map(fn => `<option value="${fn}" ${fn===f.field?'selected':''}>${fn}</option>`).join('')}</select>
      <select class="op-select"></select>
      <input class="value-input" type="text" value="${f.value||''}" placeholder="value">
      <button onclick="removeRow(this.parentElement)">&#x2715;</button>
    `;
    container.appendChild(div);
    updateOps(div);
    if (f.op) div.querySelector('.op-select').value = f.op;
  });
}

// Ask doSearch for the next page until `done` holds, exactly as scrolling to
// the bottom would. doSearch owns currentOffset and the sentinel, so this never
// touches either; a page that moves no offset means there is nothing left.
async function _loadUntil(done, maxBatches) {
  let batches = 0;
  while (hasMore && !done() && batches < maxBatches) {
    const before = currentOffset;
    await doSearch(false);
    if (currentOffset === before) break;
    batches += 1;
  }
}

async function _restoreView(state) {
  const grid = document.getElementById('results-grid');
  await _loadUntil(function() {
    return state.scroll <= 0 || grid.scrollHeight >= state.scroll + grid.clientHeight;
  }, MAX_RESTORE_BATCHES);
  if (state.selected != null) {
    await _loadUntil(function() {
      return !!grid.querySelector('.grid-cell[data-wid="' + state.selected + '"]');
    }, MAX_RESTORE_BATCHES);
    if (grid.querySelector('.grid-cell[data-wid="' + state.selected + '"]')) {
      await showDetail(state.selected);
    }
  }
  // Scroll last: showDetail focuses the cell, and focus can move the grid, so
  // the saved position has to be the final word.
  if (state.scroll > 0) grid.scrollTop = state.scroll;
}

async function loadState() {
  // Precedence is deliberately simple: a browser that has been to this page
  // before has its own saved view and that wins. Only a first visit (or one
  // with cleared storage) falls back to the TUI's saved filters.
  const local = _loadViewState();
  try {
    if (local) {
      _applyFilters(local.filters);
      if (local.sort_by) document.getElementById('sort-by').value = local.sort_by;
      if (local.sort_order) document.getElementById('sort-order').value = local.sort_order;
    } else {
      const resp = await fetch('/api/state');
      const state = await resp.json();
      if (state.filters && state.filters.length) _applyFilters(state.filters);
      if (state.sort_by) document.getElementById('sort-by').value = state.sort_by;
      if (state.sort_order) document.getElementById('sort-order').value = state.sort_order;
    }
  } catch(e) { console.warn('loadState fetch failed', e); }
  if (!document.getElementById('filter-rows').children.length) addRow();
  _restoringView = true;
  try {
    await doSearch(true);
    if (local) await _restoreView(local);
  } finally {
    _restoringView = false;
  }
}

// Scroll fires per frame; the value is only read on the next load, so a short
// settle delay is enough and keeps the write off the scroll path.
document.getElementById('results-grid').addEventListener('scroll', function() {
  if (_viewSaveTimer) return;
  _viewSaveTimer = setTimeout(function() {
    _viewSaveTimer = null;
    _saveViewState();
  }, 250);
}, {passive: true});
window.addEventListener('pagehide', _saveViewState);

document.getElementById('sort-by').onchange = () => doSearch(true);
document.getElementById('sort-order').onchange = () => doSearch(true);
document.getElementById('btn-search').onclick = () => doSearch(true);
