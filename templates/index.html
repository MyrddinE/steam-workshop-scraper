// /api/save_filter can reject the save: it answers 400 with a message when no
// target AppID is configured. Alerting "saved" regardless, as this did, told
// the user their filters were stored when they were not — the server's own
// message is the only thing that says why, so surface it instead of swallowing
// it, and only claim success on a 2xx.
async function saveFilterAndReport() {
  let resp;
  try {
    resp = await fetch('/api/save_filter', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({filters: getFilters()})
    });
  } catch (e) {
    alert('Filter not saved: ' + e.message);
    return;
  }
  if (!resp.ok) {
    let detail = resp.status + ' ' + resp.statusText;
    try {
      const body = await resp.json();
      if (body && body.error) detail = body.error;
    } catch (e) { /* a non-JSON body leaves the status line as the reason */ }
    alert('Filter not saved: ' + detail);
    return;
  }
  alert('Filter saved for scraper.');
}
document.getElementById('btn-save-filter').onclick = saveFilterAndReport;

const _scrollObserver = new IntersectionObserver((entries) => {
  if (loading || !hasMore || !currentOffset) return;
  if (entries[0].isIntersecting) doSearch(false);
});

document.addEventListener('blur', e => {
  try {
    if (!e.target || typeof e.target.classList === 'undefined') return;
    if (!e.target.classList.contains('value-input')) return;
    const row = e.target.parentElement;
    if (!row) return;
    const opSelect = row.querySelector('.op-select');
    if (!opSelect || opSelect.value !== 'percentile') return;
    let v = parseInt(e.target.value, 10);
    if (isNaN(v)) { e.target.value = '0'; return; }
    v = Math.max(0, Math.min(99, v));
    e.target.value = String(v);
  } catch (err) { console.debug('Blur handler error', err); /* must never break the page */ }
}, true);

document.addEventListener('keydown', e => {
  const grid = document.getElementById('results-grid');
  if (!grid.contains(document.activeElement)) return;
  if (!document.activeElement.classList.contains('grid-cell')) return;

  const wid = parseInt(document.activeElement.getAttribute('data-wid'), 10);
  const cells = [...grid.querySelectorAll('.grid-cell')];
  const idx = cells.indexOf(document.activeElement);

  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    // The marker is the queue control in both places now, so the shortcut runs
    // the same read-back path as a click on it: the old local `queued` class
    // flip could disagree with the server, and it drew a second indicator.
    toggleDetailQueue(wid);
    return;
  }

  if (e.key === 'l' || e.key === 'L') {
    e.preventDefault();
    _startAutoSubscribe();
    return;
  }

  {% if open_folder_enabled %}
  if (e.key === 'o' || e.key === 'O') {
    e.preventDefault();
    // The focused cell's item, the same one `s` acts on.
    openFolder(wid);
    return;
  }
  {% endif %}

  let nextIdx = idx;
  if (e.key === 'ArrowRight') nextIdx = idx + 1;
  else if (e.key === 'ArrowLeft') nextIdx = idx - 1;
  else if (e.key === 'ArrowDown') {
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    nextIdx = Math.min(idx + cols, cells.length - 1);
  }
  else if (e.key === 'ArrowUp') {
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    nextIdx = Math.max(idx - cols, 0);
  }
  else return;

  e.preventDefault();
  if (nextIdx >= 0 && nextIdx < cells.length) {
    const cell = cells[nextIdx];
    cell.focus();
    cell.scrollIntoView({block:'nearest'});
    showDetail(parseInt(cell.getAttribute('data-wid'), 10));
  }
});

let _subPollIv = null;
let _subScheduleIv = null;
let _subCanceled = false;
let _subThrottleStopped = false;

async function _startAutoSubscribe() {
  const resp = await fetch('/api/queued');
  const items = await resp.json();
  if (!items.length) { alert('No items queued for subscription.'); return; }

  const overlay = document.getElementById('sub-queue-overlay');
  const list = document.getElementById('sub-queue-list');
  const progress = document.getElementById('sub-progress');
  overlay.style.display = 'block';
  progress.textContent = `0 / ${items.length}`;
  list.innerHTML = items.map(it => `
    <div class="sub-queue-item" data-wid="${it.workshop_id}">
      <span class="spinner"></span>
      <span class="countdown"></span>
      <span>${it.title_en || it.title || 'Untitled'}</span>
      <span class="sub-queue-sub" style="color: ${it.subscription_colour}"
            title="${_escapeHtml(it.subscription_tooltip || '')}">${it.subscription_glyph || ''}</span>
    </div>
  `).join('');

  // Ensure clear-failed button is hidden on fresh start
  const clearBtn = document.getElementById('sub-clear-failed');
  if (clearBtn) clearBtn.style.display = 'none';
  document.getElementById('sub-cancel').textContent = 'Cancel';

  await fetch('/api/pause', {method:'POST'});

  _subCanceled = false;
  const stepDelay = WEB_DELAY * 1000;
  const startTime = Date.now();
  const verified = new Set();
  const opened = new Set();
  const callbackOrigin = encodeURIComponent(location.origin);

  // Poll for verification — marks items done/failed when userscript reports back
  _subPollIv = setInterval(async () => {
    try {
      const [qresp, fresp] = await Promise.all([
        fetch('/api/queued'),
        fetch('/api/sub_failures')
      ]);
      const queued = await qresp.json();
      const failures = await fresp.json();
      const queuedIds = new Set(queued.map(q => q.workshop_id));
      const failedIds = new Set(failures);
      let changed = false;
      items.forEach(item => {
        if (!queuedIds.has(item.workshop_id) && !verified.has(item.workshop_id)) {
          verified.add(item.workshop_id);
          const row = list.querySelector(`[data-wid="${item.workshop_id}"]`);
          if (row) row.classList.add(failedIds.has(item.workshop_id) ? 'failed' : 'done');
          changed = true;
        }
      });

      progress.textContent = verified.size + ' / ' + items.length;

      const scheduleDone = opened.size >= items.length;
      const allDone = verified.size >= items.length;

      if (allDone) {
        clearInterval(_subPollIv);
        _subPollIv = null;
        await fetch('/api/resume', {method:'POST'});
        setTimeout(() => { overlay.style.display = 'none'; }, 2000);
        return;
      }

      // Show "Clear Failed" if schedule finished + grace period passed + stuck items remain
      if (scheduleDone && !_subCanceled) {
        var grace = Date.now() - startTime > (items.length * stepDelay) + 15000;
        var stuck = items.length - verified.size;
        if (grace && stuck > 0) {
          var cb = document.getElementById('sub-clear-failed');
          if (cb) {
            cb.textContent = 'Clear Failed (' + stuck + ')';
            cb.style.display = '';
          }
        }
      }
    } catch(e) { console.debug('Autosubscribe poll error', e); /* continue */ }
  }, 1000);

  // Stop launching tabs while Steam is refusing us. Checked once per tab opened,
  // so it costs one request per attempt rather than a poll.
  async function _checkSubThrottle() {
    try {
      const resp = await fetch('/api/sub_health');
      const health = await resp.json();
      if (!health.throttled_at) return;
      const since = (Date.now() / 1000) - health.throttled_at;
      if (since >= health.retry_after) return;
      // A subscribe pass pauses the daemon for its duration, and the daemon is
      // only released when the pass ends -- either every item was verified, or
      // the user cancelled. Stopping the tabs early ends the pass too, so the
      // release has to happen here or the daemon stays paused indefinitely.
      _subThrottleStopped = true;
      if (_subScheduleIv) { clearInterval(_subScheduleIv); _subScheduleIv = null; }
      if (_subPollIv) { clearInterval(_subPollIv); _subPollIv = null; }
      await fetch('/api/resume', {method:'POST'});
      const cancelBtn = document.getElementById('sub-cancel');
      if (cancelBtn) cancelBtn.textContent = 'Close';
      const p = document.getElementById('sub-progress');
      if (p) {
        p.textContent = 'Steam is throttling subscription requests. Stopped opening tabs, and ' +
          'released the daemon. The rest stay queued and can be retried in about ' +
          Math.ceil((health.retry_after - since) / 60) + ' minute(s).';
      }
    } catch (e) { console.debug('sub_health check failed', e); /* keep the drain running */ }
  }

  // Countdown + tab-open loop
  _subScheduleIv = setInterval(() => {
    if (_subCanceled) return;  // stop launching new tabs on cancel
    const elapsed = Math.floor((Date.now() - startTime) / 1000);

    items.forEach((item, i) => {
      const row = list.querySelector(`[data-wid="${item.workshop_id}"]`);
      if (!row) return;
      const countdown = row.querySelector('.countdown');
      if (!countdown) return;

      const openAt = i * Math.ceil(stepDelay / 1000);
      if (opened.has(item.workshop_id)) {
        countdown.textContent = '';
        return;
      }

      if (elapsed >= openAt) {
        opened.add(item.workshop_id);
        const w = window.open(
          'https://steamcommunity.com/sharedfiles/filedetails/?id=' + item.workshop_id + '&autosubscribe=true&callback_origin=' + callbackOrigin,
          'subtab_' + item.workshop_id
        );
        if (w) { w.blur(); window.focus(); }
        countdown.textContent = '';
        _checkSubThrottle();
      } else {
        countdown.textContent = (openAt - elapsed) + 's';
      }
    });

    if (opened.size >= items.length) {
      clearInterval(_subScheduleIv);
      _subScheduleIv = null;
    }
  }, 250);
}

document.getElementById('sub-cancel').onclick = () => {
  if (_subScheduleIv) {
    _subCanceled = true;
    clearInterval(_subScheduleIv);
    _subScheduleIv = null;
    document.getElementById('sub-cancel').textContent = 'Close';
  } else {
    // Second click (Close): dismiss overlay
    if (_subPollIv) { clearInterval(_subPollIv); _subPollIv = null; }
    // Dequeue any remaining unverified items so they don't stick -- unless the
    // pass was stopped by throttling, where the whole point is to leave them
    // queued so the next drain retries them.
    if (!_subThrottleStopped) {
      var rows = document.querySelectorAll('.sub-queue-item:not(.done)');
      rows.forEach(function(row) {
        var wid = row.getAttribute('data-wid');
        if (wid) fetch('/api/subscribed/' + wid, {method:'POST'});
        row.classList.add('done');
      });
    }
    fetch('/api/resume', {method:'POST'});
    document.getElementById('sub-queue-overlay').style.display = 'none';
  }
};

document.getElementById('sub-clear-failed').onclick = () => {
  var rows = document.querySelectorAll('.sub-queue-item:not(.done)');
  rows.forEach(function(row) {
    var wid = row.getAttribute('data-wid');
    if (wid) fetch('/api/subscribed/' + wid, {method:'POST'});
    row.classList.add('done');
  });
};

// ── Daemon control ────────────────────────────────────────────────────────
let _daemonPollIv = null;
let _daemonLogOffset = 0;

async function _refreshDaemonStatus() {
  try {
    const resp = await fetch('/api/daemon');
    const st = await resp.json();
    const el = document.getElementById('daemon-status');
    if (!el) return;
    const log = st.log_file ? ' — log: ' + st.log_file : '';
    el.textContent = (st.running ? 'Running (PID: ' + st.pid + ')' : 'Not running') + log;
  } catch(e) { console.debug('Daemon status poll error', e); /* keep polling */ }
}

// The Steam login can stop working at any time -- the cookie is reissued about
// daily, and a profile nobody has opened keeps the stale one -- and when it does
// the subscriptions silently stop updating. The fact is written by a worker
// thread in another process, so it is polled rather than pushed; half a minute
// is far more often than it can change.
let _sessionWarningIv = null;
const SESSION_WARNING_POLL_MS = 30000;

async function _refreshSessionWarning() {
  try {
    const resp = await fetch('/api/session');
    const s = await resp.json();
    const el = document.getElementById('session-warning');
    if (!el) return;
    if (!s.problem) { el.style.display = 'none'; return; }
    document.getElementById('session-warning-text').textContent =
      'Steam login problem — ' + (s.detail || 'the saved cookie was not accepted') + '.';
    const link = document.getElementById('session-warning-login');
    if (link && s.login_url) link.href = s.login_url;
    el.style.display = 'flex';
  } catch(e) { console.debug('Session warning poll error', e); /* keep polling */ }
}

async function _recheckSession() {
  const btn = document.getElementById('session-warning-recheck');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  try {
    await fetch('/api/session/recheck', {method: 'POST'});
  } catch(e) { console.debug('Session recheck failed', e); /* the poll reports the state */ }
  if (btn) { btn.disabled = false; btn.textContent = 'Recheck'; }
  // The recheck's own response is deliberately ignored: the banner has one
  // source of truth and re-reading it is what keeps it that way.
  await _refreshSessionWarning();
}

document.getElementById('session-warning-recheck').onclick = _recheckSession;

// The daemon writes SGR colour escapes into its log file -- the "ignored"
// marker on a rejected discovery is red. A plain text node cannot show them, so
// the pane used to render the escape as a replacement glyph and the code itself
// as literal "[31m" text. Decode them here instead. Only SGR is handled because
// only SGR is written; anything else is left as text rather than swallowed.
const ANSI_SGR = {
  30: '#6b7280', 31: '#e06c75', 32: '#98c379', 33: '#e5c07b',
  34: '#61afef', 35: '#c678dd', 36: '#56b6c2', 37: '#d7dae0',
  90: '#6b7280', 91: '#e06c75', 92: '#98c379', 93: '#e5c07b',
  94: '#61afef', 95: '#c678dd', 96: '#56b6c2', 97: '#ffffff',
};

function _escapeHtml(text) {
  return text.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
}

function _ansiToHtml(line) {
  const parts = line.split(/\x1b\[([0-9;]*)m/);
  let html = '';
  let open = false;
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { html += _escapeHtml(parts[i]); continue; }
    const codes = parts[i].split(';').filter(c => c !== '').map(Number);
    if (open) { html += '</span>'; open = false; }
    // A bare "0", or any reset in the group, returns to the default style.
    if (codes.length === 0 || codes.includes(0)) continue;
    const style = [];
    const colour = codes.map(c => ANSI_SGR[c]).find(Boolean);
    if (colour) style.push('color:' + colour);
    if (codes.includes(1)) style.push('font-weight:600');
    if (style.length) { html += '<span style="' + style.join(';') + '">'; open = true; }
  }
  if (open) html += '</span>';
  return html;
}

// Raw lines, kept so the 500-line cap can be applied to lines rather than to
// rendered HTML -- splitting markup on newlines would cut spans in half.
let _daemonLogLines = [];

async function _pollDaemonLog() {
  const pre = document.getElementById('daemon-log');
  if (!pre) return;
  try {
    const resp = await fetch('/api/daemon/log?since=' + _daemonLogOffset);
    const data = await resp.json();
    if (data.reset) {
      // The server jumped to the tail — first poll of a large log, rotation or
      // truncation, or this poll falling further behind than it will send — so
      // nothing on screen continues the new lines. Drop them and resume from the
      // server's offset below.
      _daemonLogLines = [];
      pre.innerHTML = '';
    }
    if (data.lines && data.lines.length) {
      _daemonLogLines = _daemonLogLines.concat(data.lines).slice(-500);
      pre.innerHTML = _daemonLogLines.map(_ansiToHtml).join('\n') + '\n';
      pre.scrollTop = pre.scrollHeight;
    }
    if (typeof data.offset === 'number') _daemonLogOffset = data.offset;
  } catch(e) { console.debug('Daemon log poll error', e); /* keep polling */ }
}

function _openDaemonPanel() {
  document.getElementById('daemon-overlay').style.display = 'block';
  _daemonLogOffset = 0;
  _daemonLogLines = [];
  const pre = document.getElementById('daemon-log');
  if (pre) pre.innerHTML = '';
  _refreshDaemonStatus();
  _pollDaemonLog();
  if (!_daemonPollIv) {
    _daemonPollIv = setInterval(() => { _refreshDaemonStatus(); _pollDaemonLog(); }, 2000);
  }
}

function _closeDaemonPanel() {
  // Release the poll timer when the panel closes; it is the only thing keeping
  // the daemon routes hot while the panel is hidden.
  if (_daemonPollIv) { clearInterval(_daemonPollIv); _daemonPollIv = null; }
  document.getElementById('daemon-overlay').style.display = 'none';
}

document.getElementById('btn-daemon').onclick = _openDaemonPanel;
document.getElementById('daemon-close').onclick = _closeDaemonPanel;
document.getElementById('daemon-start').onclick = async () => {
  await fetch('/api/daemon/start', {method:'POST'});
  _refreshDaemonStatus();
};
document.getElementById('daemon-stop').onclick = async () => {
  await fetch('/api/daemon/stop', {method:'POST'});
  _refreshDaemonStatus();
};
document.getElementById('daemon-restart').onclick = async () => {
  await fetch('/api/daemon/restart', {method:'POST'});
  _refreshDaemonStatus();
};

// ── Statistics panel ──────────────────────────────────────────────────────
// Every metric is an independent chunk: the panel asks the server for the
// catalogue, then requests each metric separately and fills its own section the
// moment that response lands. Nothing is grouped or classified by cost, and no
// request waits on another. The *request order* is the seed order on the first
// ever open; after that it follows the durations measured on the previous open,
// persisted in localStorage, so the order tracks the data rather than the seed
// table. Refresh is per metric too: each chunk re-requests itself after a delay
// derived from its own last duration, so a slow metric cannot hold up a fast one.
const STATS_LABELS = {
  totals: 'Totals',
  high_water: 'Last successful API fetch',
  app_tracking: 'App tracking',
  status_counts: 'Status counts',
  coverage: 'Coverage',
  stuck_work: 'Stuck work',
  dead_queued: 'Dead but queued',
  queued_nowhere: 'Queued nowhere',
  fetch_recency: 'Fetch recency',
  translation_status: 'Translation status',
  priority_breakdowns: 'Queue priorities',
  web_throughput: 'Web scrape throughput',
  image_throughput: 'Image download throughput',
  translation_throughput: 'Translation throughput',
  tag_counts: 'Tags',
};

// The stored order is deliberately tiny and versioned, so a stale or corrupt
// entry from an older build can never break the panel: it is simply ignored.
const STATS_ORDER_KEY = 'stats.metric-order.v1';
const STATS_ORDER_VERSION = 1;
const STATS_REFRESH_FACTOR = 50;    // 50 x the metric's own measured duration
const STATS_MIN_REFRESH_MS = 2000;  // ...but never more often than every 2 s

let _statsCatalogue = [];   // [{name, note, seed_ms}] as served
let _statsTimers = {};      // metric -> setTimeout id, one per chunk
let _statsMeasured = {};    // metric -> ms, loaded from storage, updated live
let _statsToken = 0;

function _statLabel(name) {
  return STATS_LABELS[name] || name.replace(/_/g, ' ');
}

function _fmtTimestamp(ts) {
  return ts ? new Date(ts * 1000).toISOString().slice(0, 16).replace('T', ' ') : 'never';
}

function _renderCoverage(cov) {
  const total = cov.total || 0;
  if (!total) return '<p class="stat-label">No live items to cover.</p>';
  const stages = [
    ['api_fetched', 'API data'],
    ['described', 'Description'],
    ['imaged', 'Image'],
    ['translated', 'Translation'],
    ['attributed', 'Creator'],
  ];
  const rows = stages.map(function(stage) {
    const done = cov[stage[0]] || 0;
    const pct = done / total * 100;
    return '<tr><td>' + stage[1] + '</td>'
      + '<td style="white-space:nowrap">' + fmtCount(done) + ' / ' + fmtCount(total) + '</td>'
      + '<td style="width:45%"><progress value="' + pct.toFixed(1) + '" max="100"></progress></td>'
      + '<td>' + pct.toFixed(1) + '%</td></tr>';
  }).join('');
  return '<p class="stat-label">Progress over ' + fmtCount(total) + ' live items (dead items excluded).</p>'
    + '<table class="stats-table"><tbody>' + rows + '</tbody></table>';
}

function _renderStuck(stuck) {
  const queues = [['web', 'Web scrape'], ['image', 'Image'], ['translation', 'Translation'], ['api', 'API fetch']];
  let total = 0;
  queues.forEach(function(q) { total += stuck[q[0]] || 0; });
  if (!total) return '<p style="color:#44aa44">No dead items are still sitting in a queue.</p>';
  const items = queues.map(function(q) {
    return '<li>' + q[1] + ': ' + fmtCount(stuck[q[0]] || 0) + '</li>';
  }).join('');
  return '<p class="stats-stuck">&#x26A0; ' + fmtCount(total)
    + ' dead item(s) are still flagged in a work queue</p>'
    + '<ul>' + items + '</ul>'
    + '<p class="stat-label">These rows can never complete; the queues will not drain until they are cleared.</p>';
}

function _renderTotals(t) {
  return '<p><b>Alive:</b> ' + fmtCount(t.alive || 0)
    + ' &nbsp; <b>Dead:</b> ' + fmtCount(t.dead || 0)
    + ' &nbsp; <span class="stat-label">Total: ' + fmtCount(t.total || 0) + '</span></p>';
}

function _renderHandoffCount(value, zeroText, badText) {
  // Both handoff counters are meant to read zero, so a zero is an all-clear
  // worth saying in words rather than printing a bare digit.
  if (!value) return '<p style="color:#44aa44">' + zeroText + '</p>';
  return '<p class="stats-stuck">&#x26A0; ' + fmtCount(value) + ' ' + badText + '</p>';
}

function _renderPriority(b) {
  const queues = [['translation_priority', 'Translation'], ['needs_image', 'Image'], ['needs_web_scrape', 'Web scrape']];
  return queues.map(function(q) {
    const rows = b[q[0]] || [];
    let total = 0;
    rows.forEach(function(r) { total += r.cnt || 0; });
    const detail = rows.map(function(r) {
      return '<li>priority ' + r.prio + ': ' + fmtCount(r.cnt) + '</li>';
    }).join('');
    return '<div class="stat-row"><b>' + q[1] + ' queue:</b> ' + fmtCount(total) + ' waiting'
      + (detail ? '<ul>' + detail + '</ul>' : '') + '</div>';
  }).join('');
}

function _renderStatusCounts(rows) {
  if (!rows || !rows.length) return '<p class="stat-label">(none)</p>';
  return '<ul>' + rows.map(function(r) {
    return '<li>Status ' + r.status + ': ' + fmtCount(r.count) + '</li>';
  }).join('') + '</ul>';
}

function _renderRecency(r) {
  return '<ul><li>Fresh: ' + fmtCount(r.fresh || 0) + '</li>'
    + '<li>Stale: ' + fmtCount(r.stale || 0) + '</li>'
    + '<li>Never attempted: ' + fmtCount(r.blank || 0) + '</li></ul>';
}

function _renderTranslation(t) {
  return '<ul>' + Object.keys(t).map(function(k) {
    return '<li>' + k + ': ' + fmtCount(t[k]) + '</li>';
  }).join('') + '</ul>';
}

function _renderTags(tags) {
  const names = Object.keys(tags);
  if (!names.length) return '<p class="stat-label">No tags recorded.</p>';
  const sorted = names.sort(function(a, b) { return tags[b] - tags[a]; });
  const rows = sorted.map(function(name) {
    return '<tr><td>' + _escapeHtml(name) + '</td><td>' + fmtExact(tags[name]) + '</td></tr>';
  }).join('');
  return '<p>' + fmtExact(names.length) + ' distinct tags</p>'
    + '<div class="stats-scroll"><table class="stats-table"><thead><tr><th>Tag</th><th>Count</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}

function _renderAppTracking(apps) {
  if (!apps || !apps.length) return '<p class="stat-label">No tracked applications.</p>';
  const rows = apps.map(function(a) {
    return '<tr><td>' + a.appid + '</td><td>' + (a.last_page_scanned || 0) + '</td>'
      + '<td>' + (a.last_cursor || '') + '</td></tr>';
  }).join('');
  return '<table class="stats-table"><thead><tr><th>AppID</th><th>Last page</th><th>Last cursor</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>';
}

// A NULL stamp is not a zero: the stage completed before the column that
// records the time existed, so a rate cannot be computed from it. Reporting
// 0/hour would read as an idle queue rather than an unmeasurable one. Once any
// stamp exists, a 0 is a real measurement and is shown.
function _renderThroughput(t) {
  if (!t || t.last_success === null || t.last_success === undefined) {
    return '<p class="stat-label">No history yet &mdash; completion times are only recorded from here on.</p>';
  }
  return '<ul><li>Completed last hour: ' + fmtCount(t.hour || 0) + '</li>'
    + '<li>Completed last day: ' + fmtCount(t.day || 0) + '</li>'
    + '<li>Last success: ' + _fmtTimestamp(t.last_success) + '</li></ul>';
}

function _renderMetricBody(name, value) {
  if (value === null || value === undefined) return '<span class="stat-label">failed</span>';
  if (name === 'totals') return _renderTotals(value);
  if (name === 'high_water') return '<p>' + _fmtTimestamp(value) + '</p>';
  if (name === 'coverage') return _renderCoverage(value);
  if (name === 'stuck_work') return _renderStuck(value);
  if (name === 'dead_queued') return _renderHandoffCount(
    value, 'No dead item is holding a queue flag.', 'dead item(s) still hold a queue flag.');
  if (name === 'queued_nowhere') return _renderHandoffCount(
    value, 'No item is stranded: every live item is queued or complete.',
    'item(s) are in no queue and not complete.');
  if (name === 'status_counts') return _renderStatusCounts(value);
  if (name === 'fetch_recency') return _renderRecency(value);
  if (name === 'translation_status') return _renderTranslation(value);
  if (name === 'priority_breakdowns') return _renderPriority(value);
  if (name === 'web_throughput' || name === 'image_throughput'
      || name === 'translation_throughput') return _renderThroughput(value);
  if (name === 'tag_counts') return _renderTags(value);
  if (name === 'app_tracking') return _renderAppTracking(value);
  return '<pre style="white-space:pre-wrap;margin:0">' + JSON.stringify(value) + '</pre>';
}

function _intervalFor(ms) {
  return Math.max(STATS_MIN_REFRESH_MS, ms * STATS_REFRESH_FACTOR);
}

function _loadStatsOrder() {
  try {
    const raw = localStorage.getItem(STATS_ORDER_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== STATS_ORDER_VERSION
        || typeof parsed.ms !== 'object' || parsed.ms === null) return {};
    const clean = {};
    Object.keys(parsed.ms).forEach(function(name) {
      const ms = parsed.ms[name];
      if (typeof ms === 'number' && isFinite(ms) && ms >= 0) clean[name] = ms;
    });
    return clean;
  } catch (e) {
    // A corrupt or unreadable store is not worth failing the panel over.
    console.debug('stats order load failed', e);
    return {};
  }
}

function _saveStatsOrder() {
  try {
    localStorage.setItem(STATS_ORDER_KEY, JSON.stringify({v: STATS_ORDER_VERSION, ms: _statsMeasured}));
  } catch (e) {
    console.debug('stats order save failed', e);
  }
}

function _statsOrder() {
  // Seed cost until a duration is known, then the measured cost. The catalogue
  // already arrives in seed order, so unmeasured ties keep that order.
  return _statsCatalogue.slice().sort(function(a, b) {
    const am = (_statsMeasured[a.name] != null) ? _statsMeasured[a.name] : a.seed_ms;
    const bm = (_statsMeasured[b.name] != null) ? _statsMeasured[b.name] : b.seed_ms;
    if (am !== bm) return am - bm;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
}

function _loadMetric(name, token) {
  fetch('/api/metrics/' + encodeURIComponent(name)).then(function(resp) {
    return resp.json();
  }).then(function(data) {
    if (token !== _statsToken) return;  // panel closed or reopened while in flight
    const body = document.querySelector('[data-metric-body="' + name + '"]');
    if (body) body.innerHTML = _renderMetricBody(name, data.value);
    const msEl = document.querySelector('[data-metric-ms="' + name + '"]');
    if (msEl) msEl.textContent = (data.ms != null ? data.ms + ' ms' : '');
    if (typeof data.ms === 'number') {
      _statsMeasured[name] = data.ms;
      _saveStatsOrder();
    }
    // setTimeout rather than setInterval: the next request is armed only once
    // this one has landed, so a metric still computing is never started again.
    _statsTimers[name] = setTimeout(function() {
      if (token !== _statsToken) return;
      _loadMetric(name, token);
    }, _intervalFor(data.ms || 0));
  }).catch(function(e) {
    if (token !== _statsToken) return;
    const body = document.querySelector('[data-metric-body="' + name + '"]');
    if (body) body.innerHTML = '<p class="stat-label">Failed: ' + e.message + '</p>';
    _statsTimers[name] = setTimeout(function() {
      if (token !== _statsToken) return;
      _loadMetric(name, token);
    }, STATS_MIN_REFRESH_MS);
  });
}

function _openStatsPanel() {
  const overlay = document.getElementById('stats-overlay');
  const host = document.getElementById('stats-metrics');
  overlay.style.display = 'block';
  host.innerHTML = '<p>Loading…</p>';
  _statsToken += 1;
  const token = _statsToken;
  Object.keys(_statsTimers).forEach(function(name) { clearTimeout(_statsTimers[name]); });
  _statsTimers = {};
  _statsMeasured = _loadStatsOrder();
  fetch('/api/metrics').then(function(resp) {
    return resp.json();
  }).then(function(cat) {
    if (token !== _statsToken) return;
    _statsCatalogue = cat.metrics || [];
    // One section per metric, each with its own body element to fill.
    host.innerHTML = _statsOrder().map(function(meta) {
      return '<section class="stats-chunk" data-metric="' + meta.name + '">'
        + '<h3>' + _statLabel(meta.name)
        + ' <small class="stats-chunk-ms" data-metric-ms="' + meta.name + '"></small>'
        + '<span class="stats-chunk-note">' + (meta.note || '') + '</span></h3>'
        + '<div class="stats-chunk-body" data-metric-body="' + meta.name + '">'
        + '<p class="stat-label">Computing…</p></div>'
        + '</section>';
    }).join('');
    // Independent requests, deliberately not Promise.all: each chunk draws and
    // arms its own refresh timer as it lands, with no waiting for the slowest.
    _statsCatalogue.forEach(function(meta) { _loadMetric(meta.name, token); });
  }).catch(function(e) {
    if (token !== _statsToken) return;
    host.innerHTML = '<p>Failed to load statistics: ' + e.message + '</p>';
  });
}

function _closeStatsPanel() {
  _statsToken += 1;  // discard every response still in flight
  Object.keys(_statsTimers).forEach(function(name) { clearTimeout(_statsTimers[name]); });
  _statsTimers = {};
  _saveStatsOrder();
  document.getElementById('stats-overlay').style.display = 'none';
}

document.getElementById('btn-stats').onclick = _openStatsPanel;
document.getElementById('stats-close').onclick = _closeStatsPanel;

// ── View window analysis panel ────────────────────────────────────────────
// The web half of the TUI's ctrl+? screen: age-bucketed views, with the knee —
// the first bucket whose median falls below a quarter of the early peak —
// reported as the estimated view window. One request per open or recalculate;
// no polling, because the query is expensive and the data moves slowly.
let _analysisToken = 0;

// The TUI reads its bucket box the same way: fall back to 7 for anything that
// is not an integer and clamp the rest to at least one day, so a typo can never
// reach the endpoint as a zero bucket width.
function _analysisBucketDays(raw) {
  const n = Number(raw);
  if (!Number.isInteger(n)) return 7;
  return Math.max(1, n);
}

function _renderAnalysisSummary(data) {
  const items = fmtCount(data.items_analyzed || 0);
  const buckets = fmtCount((data.buckets || []).length);
  if (data.estimated_window_days == null) {
    // A null knee is not a zero-day window: the curve never fell to a quarter
    // of its early peak, so there is nothing to estimate. Say that rather than
    // printing "~0 days", which would read as a real answer.
    return '<p>Insufficient data to estimate a view window. '
      + '<span class="stat-label">(' + items + ' items analyzed, ' + buckets
      + ' buckets)</span></p>';
  }
  return '<p><b>Estimated view window: ~' + fmtCount(data.estimated_window_days)
    + ' days</b> <span class="stat-label">(' + items + ' items analyzed, '
    + buckets + ' buckets)</span></p>';
}

function _renderAnalysisTable(data) {
  const buckets = data.buckets || [];
  if (!buckets.length) {
    return '<p class="stat-label">No items with recorded views to analyze.</p>';
  }
  let maxMedian = 0;
  buckets.forEach(function(b) { if (b.median > maxMedian) maxMedian = b.median; });
  // A bar is a share of the peak, so the divisor must never be zero even when
  // every bucket's median is.
  if (maxMedian < 1) maxMedian = 1;
  const rows = buckets.map(function(b) {
    const width = (b.median / maxMedian * 100).toFixed(1);
    return '<tr>'
      + '<td>' + b.age_start + '\u2013' + b.age_end + 'd</td>'
      + '<td>' + fmtCount(b.count) + '</td>'
      + '<td>' + fmtCount(b.median) + '</td>'
      + '<td>' + fmtCount(b.p10) + '</td>'
      + '<td>' + fmtCount(b.p90) + '</td>'
      + '<td><div class="analysis-bar-track"><div class="analysis-bar" style="width:' + width + '%"></div></div></td>'
      + '</tr>';
  }).join('');
  return '<table class="stats-table analysis-table"><thead><tr>'
    + '<th>Age range</th><th>Items</th><th>Median views</th><th>P10</th><th>P90</th><th>Relative median</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function _drawAnalysis(data) {
  const summary = document.getElementById('analysis-summary');
  if (summary) summary.innerHTML = _renderAnalysisSummary(data);
  const host = document.getElementById('analysis-table-host');
  if (host) host.innerHTML = _renderAnalysisTable(data);
}

function _loadAnalysis(token) {
  const input = document.getElementById('analysis-bucket-days');
  const bucketDays = _analysisBucketDays(input ? input.value : '');
  return fetch('/api/analysis?bucket_days=' + bucketDays).then(function(resp) {
    return resp.json();
  }).then(function(data) {
    // A stale token means the panel closed or recalculated while this request
    // was in flight; drawing now would repaint something the user has left.
    if (token !== _analysisToken) return;
    _drawAnalysis(data);
  }).catch(function(e) {
    if (token !== _analysisToken) return;
    const summary = document.getElementById('analysis-summary');
    if (summary) summary.innerHTML = '<p class="stat-label">Failed: ' + e.message + '</p>';
    const host = document.getElementById('analysis-table-host');
    if (host) host.innerHTML = '';
  });
}

function _runAnalysis() {
  _analysisToken += 1;  // supersede any request still in flight
  const token = _analysisToken;
  const summary = document.getElementById('analysis-summary');
  if (summary) summary.innerHTML = '<p>Loading…</p>';
  const host = document.getElementById('analysis-table-host');
  if (host) host.innerHTML = '';
  _loadAnalysis(token);
}

function _openAnalysisPanel() {
  const overlay = document.getElementById('analysis-overlay');
  if (!overlay) return;
  const input = document.getElementById('analysis-bucket-days');
  // The TUI mounts a fresh screen at 7 days; so does this panel.
  if (input) input.value = '7';
  overlay.style.display = 'block';
  _runAnalysis();
}

function _closeAnalysisPanel() {
  _analysisToken += 1;  // discard every response still in flight
  const overlay = document.getElementById('analysis-overlay');
  if (overlay) overlay.style.display = 'none';
}

document.getElementById('btn-analysis').onclick = _openAnalysisPanel;
document.getElementById('analysis-close').onclick = _closeAnalysisPanel;
document.getElementById('analysis-recalc').onclick = _runAnalysis;

loadState();
_refreshSessionWarning();
if (!_sessionWarningIv) _sessionWarningIv = setInterval(_refreshSessionWarning, SESSION_WARNING_POLL_MS);
</script>
